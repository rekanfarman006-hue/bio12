/* Layout: phone-first single column, white sticky header, bottom tabs. One deliberate light theme (warm white + navy + gold) so phones that force dark mode don't repaint it. */
:root{--card:var(--surface);
  --bg:#F7F5F0; --surface:#FFFFFF; --surface2:#F1EDE4; --line:#E6E0D3;
  --fg:#14213D; --muted:#667085; --brand:#14284F; --brandfg:#FFFFFF; --gold:#D49B1E; --goldsoft:#FBF1D9;
  --good:#1D8A5A; --goodsoft:#E4F4EC; --bad:#C2413A; --badsoft:#FBE9E7;
  --shadow:0 1px 2px rgba(20,33,61,.05),0 4px 14px rgba(20,33,61,.05);
  --f:'Rabar','VZ','Vazirmatn',Tahoma,'Segoe UI',sans-serif; --r:18px; color-scheme:only light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}html{min-height:100%}body{min-height:100vh}
body{touch-action:manipulation;margin:0;font-family:var(--f);font-size:16px;line-height:1.7;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
html,body{overscroll-behavior-y:none}
body{padding-top:env(safe-area-inset-top,0px)}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:7}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 112px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);color:var(--fg);border-bottom:1px solid var(--line)}
header.top .in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
header.top .t{flex:1;min-width:0;line-height:1.3}
header.top small{display:block;color:var(--gold);font-weight:800;font-size:12px}
header.top b{font-size:18px;font-weight:900}
header.top .back{background:var(--surface2);border:0;border-radius:12px;width:40px;height:40px;color:inherit;font-size:20px}
.pill{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--gold);color:#16233F;white-space:nowrap}
h2{font-size:20px;font-weight:900;margin:22px 0 10px;text-wrap:balance}
h3{font-size:16px;font-weight:800;margin:0}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero{margin-top:16px;background:var(--brand);color:var(--brandfg);border-radius:20px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.hero .ring{width:92px;height:92px}
.hero .k{color:var(--gold);font-weight:800;font-size:13px}
.hero .v{font-size:15px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat .v{font-size:26px;font-weight:900;line-height:1.2}
.stat .k{font-size:12px;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:14px;background:var(--gold);color:var(--goldfg,#16233F);font-weight:900;font-size:16px}
.btn.alt{background:var(--surface);color:var(--fg);border:1px solid var(--line);font-weight:700}
.btn.dark{background:var(--brand);color:var(--brandfg)}
.btn:disabled{opacity:.5}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;text-align:start}
.row .ix{width:40px;height:40px;flex:none;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-weight:900}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:800;line-height:1.45}
.row .tx span{font-size:13px;color:var(--muted)}
.row .lock{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--good);border-radius:6px}
.unit{font-size:13px;font-weight:800;color:var(--muted);margin:18px 2px 8px;letter-spacing:.01em}
.weights{display:flex;flex-direction:column;gap:8px}
.wrow{display:grid;grid-template-columns:7.5em 1fr 2.2em;gap:10px;align-items:center;font-size:13px}
.wrow .wb{height:14px;border-radius:7px;background:var(--surface2);overflow:hidden}
.wrow .wb i{display:block;height:100%;background:var(--gold);border-radius:7px}
.wrow .wn{text-align:left;font-weight:800}
/* question */
.qhead{display:flex;align-items:center;gap:8px;margin:16px 0 8px;flex-wrap:wrap}
.tag{font-size:12px;border-radius:999px;padding:2px 10px;background:var(--surface2);color:var(--muted);font-weight:700}
.tag.g{background:var(--goldsoft);color:var(--fg)}
.qtext{font-size:18px;font-weight:700;line-height:1.85;margin:0 0 12px}
.qimg{display:block;max-width:100%;max-height:300px;margin:0 auto 12px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;line-height:1.7}
.opt .L{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-weight:900;font-size:14px;direction:ltr}
.opt .ot{flex:1;min-width:0}
.opt.sel{border-color:var(--brand)}
.opt.ok{border-color:var(--good);background:var(--goodsoft)}
.opt.ok .L{background:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--badsoft)}
.opt.no .L{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.tblwrap{overflow-x:auto;margin-bottom:10px;border-radius:12px;border:1px solid var(--line)}
table.qt{border-collapse:collapse;width:100%;table-layout:fixed;font-size:14px;background:var(--surface)}
table.qt th,table.qt td{border:1px solid var(--line);padding:8px;text-align:center;vertical-align:middle}
table.qt th{background:var(--surface2);font-weight:800}
table.qt td.L,table.qt th.L{font-weight:900;direction:ltr;width:36px}
table.qt.wide{min-width:560px}
table.qt tr.ok td{background:var(--goodsoft)}
table.qt tr.no td{background:var(--badsoft)}
table.qt tr.pick{cursor:pointer}
.tsel{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tsel .opt{justify-content:center;padding:10px}
.expl{margin-top:14px;border-radius:14px;padding:14px 16px;border:1px solid var(--line);background:var(--surface)}
.expl.ok{border-color:var(--good)}
.expl.no{border-color:var(--bad)}
.expl b.v{display:block;font-weight:900;margin-bottom:4px}
.expl.ok b.v{color:var(--good)}
.expl.no b.v{color:var(--bad)}
.ref{margin-top:10px;font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.qnav{display:flex;gap:10px;margin-top:16px}
.qnav .btn{flex:1}
.prog{height:6px;background:var(--surface2);border-radius:6px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--gold)}
.timer{font-weight:900;font-size:15px;direction:ltr}
.timer.low{color:var(--bad)}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:12px}
.dots button{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;padding:0}
.dots button.done{background:var(--brand);color:var(--brandfg);border-color:var(--brand)}
.dots button.cur{outline:2px solid var(--gold)}
.dots button.ok{background:var(--good);color:#fff;border-color:var(--good)}
.dots button.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.score{text-align:center;padding:22px 16px}
.score .big{font-size:56px;font-weight:900;line-height:1}
.score .of{color:var(--muted)}
.ped{display:flex;gap:10px;flex-wrap:wrap}
.ped svg{background:#fff;border-radius:8px;max-width:100%}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:9px 2px 11px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;font-weight:700}
nav.tabs svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--fg)}
nav.tabs button[aria-current="page"] svg{color:var(--gold)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:14px}
select,input[type=number],input[type=date]{width:100%;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit}
.chk{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--brand);flex:none}
.chk .tx{flex:1;min-width:0}
.chk .tx>span{display:block;font-size:12px;color:var(--muted)}
.yr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.yr:last-child{border-bottom:0}
.yr b{flex:1;white-space:nowrap}
.yr span{text-align:start}
.big2{font-size:34px;font-weight:900;line-height:1.1}
.rep{background:var(--goldsoft);color:var(--fg)}
.lb{display:flex;flex-direction:column;gap:8px}
.lbr{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 12px}
.lbr.me{border-color:var(--gold);background:var(--goldsoft)}
.lbr .rk{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:var(--surface2);font-size:14px}
.lbr .rk.r1{background:#FFC928;color:#16233F}.lbr .rk.r2{background:#C9D3E6;color:#16233F}.lbr .rk.r3{background:#D89B5E;color:#16233F}
.lbr .nm{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbr .nm small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.lbr .n{font-weight:900;font-size:18px;text-align:left}
.lbr .n small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.youtag{font-size:11px;background:var(--gold);color:#16233F;border-radius:6px;padding:0 6px;margin-inline-start:6px}
.demo{background:var(--goldsoft);border:1px dashed var(--gold);border-radius:12px;padding:8px 12px;font-size:13px}
textarea{width:100%;min-height:90px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;resize:vertical}
.aians b{color:var(--brand)}.aians{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;white-space:pre-wrap;line-height:1.85}
.aibtn{margin-top:10px;width:100%;border:2px solid var(--brand);background:var(--surface);color:var(--fg);border-radius:12px;padding:10px;font-weight:800}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(5,10,25,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--bg);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
input[type=text]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.err{color:var(--bad);font-size:14px;min-height:1.2em}
.toast{white-space:nowrap;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--brand);color:var(--brandfg);font-weight:800;border-radius:999px;padding:8px 20px;z-index:30}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.seg{display:flex;background:var(--surface2);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:8px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
@media (max-width:380px){.qtext{font-size:17px}.hero{grid-template-columns:1fr}.hero .ring{margin:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.acc{position:relative;background:var(--surface2);border:0;border-radius:12px;padding:8px 12px;color:inherit;font-weight:800;font-size:13px;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero2{margin-top:16px;background:var(--brand);color:var(--brandfg);border-radius:20px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.hero2 .ring{width:96px;height:96px}
.hero2 .cd{font-size:40px;font-weight:900;line-height:1;color:var(--gold)}
.hero2 .k{font-size:13px;font-weight:700;opacity:.85}
.hero2 .v{font-size:15px;margin-top:4px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.rv{border:2px solid var(--gold);background:var(--goldsoft)}
.rv .big2{color:var(--fg)}
.weak{display:flex;flex-direction:column;gap:8px}
.wk{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;width:100%;text-align:start}
.wk b{font-weight:800;font-size:15px;line-height:1.45}
.wk .p{font-weight:900;font-size:18px}
.wk small{grid-column:1/-1;color:var(--muted);font-size:12px}
.wk .wb{grid-column:1/-1;height:8px;border-radius:6px;background:var(--surface2);overflow:hidden}
.wk .wb i{display:block;height:100%;border-radius:6px}
.lo{color:var(--bad)}.mid{color:var(--gold)}.hi{color:var(--good)}
.note{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:13px}
.wait{opacity:.6;pointer-events:none}
.imgph{display:grid;place-items:center;height:120px;margin:0 auto 12px;border-radius:12px;border:1px dashed var(--line);color:var(--muted);font-size:13px}
input[type=password]{width:100%;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit}
.copy{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.copy b{flex:1;direction:ltr;text-align:left;font-size:18px}
.copy button{border:0;background:var(--brand);color:var(--brandfg);border-radius:10px;padding:6px 12px;font-weight:800}
.boot{min-height:70vh;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.dueinfo{font-size:12px;color:var(--muted)}
.freq{display:flex;flex-direction:column;gap:8px}
.frow{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;text-align:start}
.frow .fr{width:28px;height:28px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:900;font-size:13px}
.frow:nth-child(1) .fr{background:#FFC928;color:#16233F}.frow:nth-child(2) .fr{background:#C9D3E6;color:#16233F}.frow:nth-child(3) .fr{background:#D89B5E;color:#16233F}
.frow .fn{min-width:0;display:flex;flex-direction:column;gap:4px}
.frow .fn b{font-weight:800;font-size:14px;line-height:1.5}
.frow .fn small{font-size:12px;color:var(--muted)}
.frow .wb{height:8px;border-radius:6px;background:var(--surface2);overflow:hidden}
.frow .wb i{display:block;height:100%;background:var(--gold);border-radius:6px}
.frow .fv{font-weight:900;font-size:20px}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:140px}
.d7{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.d7 i{display:block;width:70%;background:var(--gold);border-radius:6px 6px 2px 2px}
.d7 span{font-size:12px;font-weight:800}
.d7 small{font-size:10px;color:var(--muted);white-space:nowrap}
.inst{border:2px dashed var(--gold);background:var(--goldsoft)}
.inst .x,.ldel{border:0;background:none;color:var(--muted);font-size:16px;padding:2px 6px}
details.lday{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
details.lday[open]{border-color:var(--gold)}
details.lday summary{display:flex;gap:10px;align-items:center;cursor:pointer;list-style:none;font-weight:800}
details.lday summary::-webkit-details-marker{display:none}
details.lday summary::before{content:'‹';color:var(--muted);font-size:18px;transition:transform .2s}
details.lday[open] summary::before{transform:rotate(-90deg)}
.lday .ld{flex:1}
.lday .lm{font-size:12px;color:var(--muted);font-weight:700}
.lit{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.lit:first-of-type{margin-top:8px}
.lit .lt{flex:1;min-width:0;white-space:pre-wrap;line-height:1.7}
.lit.dn .lt{text-decoration:line-through;color:var(--muted)}
.lck{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--good);background:var(--surface);color:#fff;font-weight:900;display:grid;place-items:center;padding:0}
.lit.dn .lck{background:var(--good)}
.fb{border-inline-start:4px solid var(--bad)}
.pending .opt.sel{border-color:var(--gold);position:relative}
.pending .opt.sel::after{content:'';position:absolute;inset-inline-end:14px;top:50%;width:18px;height:18px;margin-top:-9px;border:3px solid var(--gold);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.pending .opt:not(.sel){opacity:.7}
@keyframes spin{to{transform:rotate(360deg)}}
nav.tabs button{position:relative;font-size:11px;line-height:1.25;padding:8px 1px 10px}
nav.tabs button span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-inline:2px}
nav.tabs .nb{position:absolute;top:4px;inset-inline-start:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:999px;font-size:10px;min-width:17px;height:17px;line-height:17px;padding:0 4px}
.tiles{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.tile{display:grid;grid-template-columns:52px 1fr;grid-template-rows:auto auto auto;column-gap:14px;row-gap:2px;align-items:center;text-align:start;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;border-inline-start:6px solid var(--gold)}
.tile .ti{grid-row:1/4;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--goldsoft);color:var(--fg)}
.tile .ti svg{width:28px;height:28px}
.tile b{font-size:19px;font-weight:900}
.tile span{font-size:13px;color:var(--muted)}
.tile small{font-size:13px;font-weight:700;color:var(--fg)}
.tile.t2{border-inline-start-color:var(--good)}.tile.t2 .ti{background:var(--goodsoft)}
.tile.t3{border-inline-start-color:#6C7BD9}.tile.t3 .ti{background:rgba(108,123,217,.16)}
.dnav{display:grid;grid-template-columns:44px 1fr 44px;gap:10px;align-items:center;margin-top:16px;text-align:center}
.dnav button{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px}
.dnav button:disabled{opacity:.35}
.dnav b{display:block;font-size:20px;font-weight:900}
.dnav small{color:var(--muted);font-size:13px}
.kindbtn{display:flex;flex-direction:column;gap:4px;text-align:start;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px}
.kindbtn b{font-weight:900}.kindbtn span{font-size:12px;color:var(--muted)}
.phead{display:grid;grid-template-columns:84px 1fr 70px;gap:8px;margin:16px 4px 6px;font-size:12px;font-weight:800;color:var(--muted)}
.phead span:last-child{text-align:center}
.prows{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:84px 1fr 70px;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
.prow.st{border-inline-start:4px solid var(--gold)}
.prow.done{background:var(--goodsoft);border-color:var(--good)}
.prow.done .plabel,.prow.done .pnote{text-decoration:line-through;color:var(--muted)}
.ptime{width:100%;min-width:0;background:var(--surface2);color:var(--fg);border:0;border-radius:10px;padding:8px 4px;font:inherit;font-size:14px;direction:ltr;text-align:center}
.pbody{min-width:0;display:flex;flex-direction:column;gap:6px}
.pst{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pst select{padding:7px 6px;font-size:13px;border-radius:10px}
.plabel,.pnote{width:100%;min-width:0;background:transparent;color:var(--fg);border:0;border-bottom:1px dashed var(--line);padding:6px 2px;font:inherit;font-size:14px}
.plabel{font-weight:700}
.pact{display:flex;gap:4px;align-items:center;justify-content:center}
.pdone{width:34px;height:34px;border-radius:50%;border:2px solid var(--good);background:var(--surface);color:#fff;font-weight:900;padding:0}
.prow.done .pdone{background:var(--good)}
.pdel{border:0;background:none;color:var(--muted);font-size:15px;padding:4px}
.addrow{margin-top:10px}.addrow .btn{padding:11px 6px;font-size:14px}
.quote{margin-top:16px;text-align:center;border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--surface)}
.quote b{display:block;color:var(--gold);font-weight:900}
.quote .ar{font-family:'Amiri','Traditional Arabic',serif;font-size:20px;margin:6px 0}
.quote span{font-size:13px;color:var(--muted)}
.fri{margin-top:16px;border-radius:16px;padding:14px 16px;background:var(--surface2);display:flex;flex-direction:column;gap:4px}
.fri.on{background:var(--goodsoft);border:2px solid var(--good)}
.fri b{font-weight:900}.fri span{font-size:14px}
.wsub{margin-bottom:14px}

/* Phone night mode must not darken the app: only the in-app switch (html[data-theme=dark]) does. Declaring a dark-scheme rule tells browsers with their own forced dark mode (e.g. Samsung Internet) that the page handles dark itself, so they leave it alone; the rule changes nothing. */
:root{color-scheme:only light}
:root:not([data-theme=dark]){color-scheme:only light}:root[data-theme=dark]{color-scheme:dark}@media (prefers-color-scheme:dark){.cm.me{background:#1F2D45;border-color:#2E4266}:root:not([data-theme=dark]){color-scheme:only light;background:#FFFFFF}}

// Tiny Supabase client (REST + Auth over plain fetch). Replaces supabase-js, whose auth lock
// could hang on some Android browsers. Every request has a time limit, so nothing waits forever.
function SBC(url,key,opt){
  const SK=(opt&&opt.storageKey)||'sb-auth';

    }
  };

function hexMix(a,p,b){const h=x=>/^#[0-9a-f]{6}$/i.test(x)?[1,3,5].map(i=>parseInt(x.substr(i,2),16)):null;const A=h(a),B=h(b);if(!A||!B)return null;const t=p/100;return '#'+A.map((v,i)=>Math.round(v*t+B[i]*(1-t)).toString(16).padStart(2,'0')).join('')}

  el.textContent='html:root{--brand:'+B+';--gold:'+C+';--goldfg:'+A[4]+';--goldsoft:'+A[5]+';--bg:'+M(C,7,'#FFFFFF')+';--surface:#FFFFFF;--surface2:'+M(C,12,'#FFFFFF')+';--line:'+M(C,20,'#ECEAE6')+

function lbRow(r){return '<div class="lbr'+(r.me?' me':'')+'"><div class="rk num'+(r.rank<4?' r'+r.rank:'')+'">'+r.rank+'</div><div class="nm">'+esc(r.nick)+(r.me?'<span class="youtag">تۆ</span>':'')+'<small><span class="num">'+(r.n||0)+'</span> حەلکراو · <span class="num">'+r.pct+'%</span> ڕاست</small></div><div class="n num">'+lbOk(r)+'<small>وەڵامی ڕاست</small></div></div>'}
function lbOk(r){return r.ok!=null?r.ok:Math.round((r.n||0)*(r.pct||0)/100)}
function lbRows(B,n){return '<div class="lb">'+B.top.slice(0,n).map(lbRow).join('')+(B.me&&B.me.rank>n?'<div class="muted" style="text-align:center">⋯</div>'+lbRow(B.me):'')+'</div>'}

  if(!B)return h+'<div class="card empty">لیستەکە ئامادە دەکرێت…</div>';
  h+=(B.all.top.length?lbRows(B.all,5):'<div class="card empty">هێشتا کەس نییە. یەکەم کەس بە!</div>');
  h+='<div class="stack" style="margin-top:10px">'+(ST.user?'':'<button class="btn" data-act="joinlb">هەژمار دروست بکە و بچۆ ناو لیستەکە</button>')+'<button class="btn alt" data-act="openboard">هەموو لیستەکە</button></div>';return h}

function fibTick(){clearInterval(FIBT);let n=0;FIBT=setInterval(()=>{if(!V.lock||!V.fib||V.fib.wait){clearInterval(FIBT);return}
  const el=document.getElementById('fibt'),ms=fibLeft();if(!ms){clearInterval(FIBT);render();return}
  if(el)el.textContent=Math.floor(ms/60000)+':'+String(Math.floor(ms%60000/1000)).padStart(2,'0');
  if(++n%5===0)fibCheck(true)},1000)}
async function fibStart(prov){V.fib={wait:1};render();let r;try{r=await sb.functions.invoke('pay',{body:{act:'create',prov}})}catch(e){r={error:e}}
  const d=r&&r.data;if(d&&d.paid){V.fib=null;fibDone();return}
  if(!d||!d.ok||!d.pay){V.fib=null;if(d&&d.err==='nokey'){toast('ئەم ڕێگەیە هێشتا ئامادە نییە، لە ڕێگەی تێلیگرامەوە بیکە.')}else toast(d&&d.err==='auth'?'سەرەتا بچۆ ژوورەوە.':'هەڵەیەک ڕوویدا، دووبارە هەوڵ بدەرەوە.');render();return}
  V.fib=d.pay;render();fibTick();if(prov==='fastpay'&&d.pay.link)window.open(d.pay.link,'_blank')}
async function fibCheck(silent){if(!V.fib||!V.fib.id)return;let r;try{r=await sb.functions.invoke('pay',{body:{act:'status',id:V.fib.id}})}catch(e){r={error:e}}
  const d=r&&r.data;if(d&&d.paid){fibDone();return}if(!silent)toast(d&&d.status==='DECLINED'?'پارەدانەکە ڕەتکرایەوە یان کاتی تەواو بوو.':'هێشتا پارەکە نەگەیشتووە. چەند چرکەیەک چاوەڕێ بکە.')}
async function fibDone(){clearInterval(FIBT);V.fib=null;V.lock=0;await loadMe().catch(()=>{});render();toast('پیرۆزە! ئێستا پرۆیت، هەموو شتێک کرایەوە.')}

function annSheet(){const L=ST.annL;const r=new Set(load('klil_ann_read',[]));
  const h='<div class="sphd"><button class="spback" data-act="annx" aria-label="گەڕانەوە"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button><div class="spt"><b>ئاگادارکردنەوەکان</b><small>هەواڵ و نامەکانی Klil</small></div></div>'+
   '<div class="spbody">'+(!L?'<div class="muted chempty">دەهێنرێت…</div>':L.length?L.map(a=>'<div class="annc'+(r.has(a.id)?'':' new')+'"><span class="anni2">'+ic('bell')+'</span><div><b>'+esc(a.title||'')+'</b>'+(a.body?'<p dir="auto">'+esc(a.body).replace(/\n/g,'<br>')+'</p>':'')+(a.created_at?'<small class="muted num">'+esc(fmtD(String(a.created_at).slice(0,10)))+'</small>':'')+'</div></div>').join(''):'<div class="supwel"><b>هێشتا هیچ ئاگادارکردنەوەیەک نییە</b></div>')+'</div>';
  return sheet(h,'full supsheet')}
function tabsOld(){const t=[['home','سەرەکی','home'],['today','ئەمڕۆ','today'],['ch','بەندەکان','ch'],['ex','ئەسیلەکان','ex'],['mist','پێداچوونەوە','mist']],nd=dueIds().length;
  return '<nav class="tabs"><div class="in">'+t.map(x=>'<button data-tab="'+x[0]+'"'+(V.tab===x[0]&&!RUN?' aria-current="page"':'')+'>'+icon(x[2])+x[1]+(x[0]==='mist'&&nd?' <span class="num">('+nd+')</span>':'')+'</button>').join('')+'</div></nav>'}
function ring(p,label){const r=40,c=2*Math.PI*r;p=Math.max(0,Math.min(100,p));return '<svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="'+r+'" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="10"/><circle cx="50" cy="50" r="'+r+'" fill="none" stroke="var(--gold)" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+(c*p/100)+' '+c+'" transform="rotate(-90 50 50)"/><text x="50" y="'+(label?52:57)+'" text-anchor="middle" font-size="22" font-weight="900" fill="currentColor" font-family="VZ,Tahoma">'+Math.round(p)+'%</text>'+(label?'<text x="50" y="70" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor" font-family="VZ,Tahoma">'+label+'</text>':'')+'</svg>'}
function lockBar(){return unlocked()?'':'<button class="row" data-act="unlock" style="margin-top:12px;border-color:var(--gold);background:var(--goldsoft)"><div class="ix" style="background:var(--gold);color:#16233F">'+ic('key')+'</div><div class="tx"><b>کردنەوەی هەموو بەندەکان</b><span>کەرتی یەکەمی هەر دەرسێک بەخۆڕاییە. بۆ ئەوانی تر هەژمارەکەت چالاک بکە.</span></div></button>'}
function pctCls(p){return p>=70?'hi':p>=45?'mid':'lo'}
function pctCol(p){return p>=70?'var(--good)':p>=45?'var(--gold)':'var(--bad)'}

// ----- countdown + daily goal -----
function countdown(){const P=plan(),dl=dayDiff(todayStr(),P.date);return dl}
function heroCard(){const P=plan(),td=ST.days[todayStr()]||0,per=Math.max(1,+P.per||1),dl=countdown();
  return '<div class="hero3">'+ring(td/per*100,'')+'<div class="h3t"><div class="h3a"><b class="num">'+(dl>=0?dl:0)+'</b> ڕۆژ ماوە بۆ وزاری</div><div class="h3s">(بۆ تاقیکردنەوەی نیشتمانی)</div>'+
   '<div class="h3g">ئامانجی ئەمڕۆ'+(td>=per?' · گەیشتیت':'')+'</div><div class="h3n"><span class="num">'+td+'</span> لە <span class="num">'+per+'</span> پرسیار حەل کراوە</div></div></div>'}
function statsRow(){const all=statsFor(QS);
  return '<div class="grid3"><div class="stat"><div class="v num">'+all.seen+'</div><div class="k">لە <span class="num">'+QS.length+'</span> پرسیار</div></div><div class="stat"><div class="v num">'+all.pct+'%</div><div class="k">ڕێژەی ڕاستی</div></div><div class="stat"><div class="v num">'+streak()+'</div><div class="k">ڕۆژ لەسەر یەک</div></div></div>'}

// ----- smart review -----
// ----- weekly 20-question test (one per week, from what the student has studied) -----
function wtWeek(){const t=todayStr();return addDays(t,-((dow(t)+1)%7))}   // Saturday that starts this week
async function loadWt(){if(!ST.user)return;const s=CUR;let r=await sb.from('weekly_test').select('wk,started,finished,good,score').eq('user_id',ST.user.id).eq('wk',wtWeek()).eq('sub',s).maybeSingle();
  if(r.error&&s==='bio')r=await sb.from('weekly_test').select('wk,started,finished,good,score').eq('user_id',ST.user.id).eq('wk',wtWeek()).maybeSingle();if(s!==CUR)return;ST.wt=r.data||null;if(r.data&&!r.data.finished)ST.wt.open=1;if(paid())loadMt()}
async function loadMt(){const s=CUR,r=await sb.from('monthly_test').select('mon,started,finished,good,score').eq('user_id',ST.user.id).eq('mon',todayStr().slice(0,8)+'01').eq('sub',s).maybeSingle();if(s!==CUR)return;ST.mt=r.error?{err:1}:(r.data||null);if(r.data&&!r.data.finished)ST.mt.open=1}
async function loadWtBoard(){let r=await sb.rpc('weekly_test_board',{p_sub:CUR});if(r.error&&CUR==='bio')r=await sb.rpc('weekly_test_board');if(!r.error){ST.wtb=r.data;if(!RUN)render()}}
async function loadMtBoard(){const r=await sb.rpc('monthly_test_board',{p_sub:CUR});if(!r.error){ST.mtb=r.data;if(!RUN)render()}}
function course(){return !!(ST.prof&&(ST.prof.course||ST.prof.is_admin))}
function mixCard(){if(!ST.user||!paid())return '';return '<h2>تاقیکردنەوەی تێکەڵ</h2><div class="card stack wtc"><span>وەک تاقیکردنەوەی کۆتایی ساڵ: <span class="num">50</span> پرسیار لە هەموو دەرسەکان پێکەوە · <span class="num">3</span> کاتژمێر · هەر کاتێک بتەوێت.</span><button class="btn dark" data-act="mixstart">دەستپێکردن</button></div>'}
function mtCard(){if(!ST.user||!course()||(ST.mt&&ST.mt.err))return '';const M=ST.mt;
  let h='<h2>تاقیکردنەوەی مانگانە <span class="pill" style="font-size:12px">کۆرس</span></h2><div class="card stack wtc">';
  if(M&&M.finished)h+='<div style="display:flex;align-items:center;gap:12px"><div class="big2 num '+pctCls(M.score)+'">'+M.score+'</div><div>نمرەی ئەم مانگەت لە <span class="num">100</span><br><span class="muted" style="font-size:13px"><span class="num">'+M.good+'</span> ڕاست لە <span class="num">50</span> · مانگی داهاتوو دووبارە دەکرێتەوە</span></div></div><button class="btn alt" data-act="mtboard">ڕیزبەندی ئەم مانگە</button>';
  else h+='<span>وەک ڕۆژی وەزاری: <span class="num">50</span> پرسیار لەو بەشانەی '+esc(subName())+' کە خوێندووتن · <span class="num">3</span> کاتژمێر · مانگی جارێک.</span><button class="btn dark" data-act="mtstart">'+(M&&M.open?'بەردەوامبوون':'دەستپێکردن')+'</button><button class="linkbtn" data-act="mtboard">ڕیزبەندی ئەم مانگە</button>';
  return h+'</div>'}
function viewMtBoard(){const B=ST.mtb;let h=header('تاقیکردنەوەی مانگانە','ڕیزبەندی ئەم مانگە · '+subName(),true)+'<div class="wrap">';
  if(!B)return h+'<div class="card empty" style="margin-top:16px">چاوەڕێ بکە…</div></div>';
  if(!B.top.length)return h+'<div class="card empty" style="margin-top:16px">هێشتا کەس تاقیکردنەوەی ئەم مانگەی نەکردووە.</div></div>';
  const row=r=>'<div class="lbr'+(r.me?' me':'')+'"><div class="rk num'+(r.rank<4?' r'+r.rank:'')+'">'+r.rank+'</div><div class="nm">'+esc(r.nick)+(r.me?'<span class="youtag">تۆ</span>':'')+'<small><span class="num">'+r.good+'</span>/50 · <span class="num">'+Math.round(r.secs/60)+'</span> خولەک</small></div><div class="n num">'+r.score+'<small>نمرە</small></div></div>';
  return h+'<div class="lb" style="margin-top:16px">'+B.top.map(row).join('')+(B.me&&B.me.rank>50?row(B.me):'')+'</div></div>'}
function wtCard(){if(!ST.user)return '';const W=ST.wt,end=addDays(wtWeek(),6);

  else h+='<span>٢٠ پرسیاری هەڕەمەکی لەو بەشانەی خوێندووتن · ٣٠ خولەک · هەفتەی جارێک (هەتا '+fmtD(end)+').</span><button class="btn dark" data-act="wtstart">'+(W&&W.open?'بەردەوامبوون لە تاقیکردنەوە':'دەستپێکردن')+'</button><button class="linkbtn" data-act="wtboard">ڕیزبەندی ئەم هەفتەیە</button>';
  return h+'</div>'}
function viewWtBoard(){const B=ST.wtb;let h=header('تاقیکردنەوەی هەفتانە','ڕیزبەندی ئەم هەفتەیە · '+subName(),true)+'<div class="wrap">';
  if(!B)return h+'<div class="card empty" style="margin-top:16px">چاوەڕێ بکە…</div></div>';
  if(!B.top.length)return h+'<div class="card empty" style="margin-top:16px">هێشتا کەس تاقیکردنەوەی ئەم هەفتەیەی نەکردووە. یەکەم کەس بە!</div></div>';
  const row=r=>'<div class="lbr'+(r.me?' me':'')+'"><div class="rk num'+(r.rank<4?' r'+r.rank:'')+'">'+r.rank+'</div><div class="nm">'+esc(r.nick)+(r.me?'<span class="youtag">تۆ</span>':'')+'<small><span class="num">'+r.good+'</span>/20 · <span class="num">'+Math.round(r.secs/60)+'</span> خولەک</small></div><div class="n num">'+r.score+'<small>نمرە</small></div></div>';
  h+='<div class="lb" style="margin-top:16px">'+B.top.map(row).join('')+(B.me&&B.me.rank>50?row(B.me):'')+'</div><p class="muted" style="font-size:13px">ڕیزبەندی بەپێی نمرە، پاشان خێرایی. هەموو شەممەیەک نوێ دەبێتەوە.</p></div>';
  return h}
function reviewCard(){if(!ST.user)return '';const due=dueIds(),all=reviewIds();
  if(!all.length)return '';
  let h='<h2>پێداچوونەوەی زیرەک</h2><div class="card stack rv">';
  if(due.length)h+='<div style="display:flex;align-items:baseline;gap:10px"><span class="big2 num">'+due.length+'</span><span>پرسیار ئەمڕۆ کاتی پێداچوونەوەیانە</span></div><button class="btn dark" data-act="runreview">دەست پێبکە</button>';
  else{const nx=all.map(id=>ST.prog[id].due).filter(Boolean).sort()[0];h+='<div>ئەمڕۆ هیچ پێداچوونەوەیەکت نییە. '+(nx?'دانەی داهاتوو: <b>'+fmtD(nx)+'</b>':'')+'</div>'}
  h+='<p class="muted" style="margin:0;font-size:13px">هەر پرسیارێک هەڵە بکەیت، دوای ١ ڕۆژ، پاشان ٣ ڕۆژ، پاشان ٧ ڕۆژ دەگەڕێتەوە. کە سێ جار لە کاتی خۆیدا ڕاستت کرد، فێری بوویت.</p></div>';return h}

// ----- weak spots -----
function secStats(){const out=[];SECK.forEach(k=>{const L=QS.filter(q=>q.s===k);const s=statsFor(L);if(s.seen)out.push({k,...s})});return out}
function weakList(min){return secStats().filter(x=>x.seen>=(min||3)).sort((a,b)=>a.pct-b.pct||b.seen-a.seen)}
function wkRow(x,extra){return '<button class="wk" data-act="runsec" data-s="'+x.k+'"><b>'+x.k+' · '+SEC[x.k][0]+'</b><span class="p num '+pctCls(x.pct)+'">'+x.pct+'%</span><div class="wb"><i style="width:'+Math.max(4,x.pct)+'%;background:'+pctCol(x.pct)+'"></i></div><small>'+(extra||('ڕاست <span class="num">'+x.ok+'</span> لە <span class="num">'+x.seen+'</span>'+pgTxt(x.k)))+'</small></button>'}
function weakCard(){const W=weakList(3).filter(x=>x.pct<70).slice(0,3);if(!W.length)return '';
  return '<h2>خاڵە لاوازەکانت</h2><div class="weak">'+W.map(x=>wkRow(x)).join('')+'</div><button class="btn alt" style="margin-top:10px" data-act="openweak">ڕاپۆرتی تەواو</button>'}
function viewWeak(){const W=weakList(1);
  let h=header('ڕاپۆرتی خاڵە لاوازەکان','بەشەکان لە لاوازترینەوە',true)+'<div class="wrap">';
  if(!W.length)return h+'<div class="card empty" style="margin-top:16px">هێشتا پرسیارت حەل نەکردووە. دوای چەند پرسیارێک ئەم ڕاپۆرتە دروست دەبێت.</div></div>';
  h+='<p class="muted" style="font-size:14px">ڕێژەی ڕاستی لە هەر بەشێک (دوایین وەڵامت). سوور = پێویستی بە خوێندنەوەیە. کرتە لە بەشێک بکە بۆ ڕاهێنان.</p><div class="weak">'+W.map(x=>wkRow(x)).join('')+'</div>';
  const nos=SECK.filter(k=>!W.find(x=>x.k===k)&&QS.some(q=>q.s===k&&canQ(q)));
  if(nos.length)h+='<h2>هێشتا دەستت پێنەکردووە</h2><p class="muted" style="font-size:14px;margin-top:-4px">'+nos.map(k=>k+' '+SEC[k][0]).join('، ')+'</p>';
  return h+'</div>'}

function paceCard(small){
  const P=plan(),pool=QS.filter(q=>canQ(q)),left=pool.filter(q=>!done_(q.id)).length,per=Math.max(1,+P.per||1);
  const days=Math.ceil(left/per),fin=addDays(todayStr(),days),dl=Math.max(1,countdown()),need=Math.ceil(left/dl),td=ST.days[todayStr()]||0,ok=fin<=P.date;
  if(small)return '<h2>پلانی خوێندنەکەت</h2><div class="card stack"><div style="display:flex;gap:12px;align-items:center"><div style="flex:1">'+(left?'بەم خێراییە (<span class="num">'+per+'</span> لە ڕۆژێکدا) تەواو دەبیت لە <b>'+fmtD(fin)+'</b>':'هەمووت کردووە!')+'</div><span class="pill">'+(left?(ok?'پێش وەزاری':'دوای وەزاری!'):'✓')+'</span></div><button class="btn alt" data-tab="today">گۆڕینی ئامانج و ڕۆژی وەزاری</button></div>';
  return '<h2>ئامانجی ڕۆژانە و ژمێرەری وەزاری</h2><div class="card stack">'+
   '<div class="grid2"><div class="field"><label for="pper">ڕۆژانە چەند پرسیار؟</label><input type="text" id="pper" value="'+per+'" inputmode="numeric" autocomplete="off"></div>'+

function freqData(){const cnt={},sc={},yrs={};QS.forEach(q=>{const c=chOf(q);cnt[c]=(cnt[c]||0)+1;sc[q.s]=(sc[q.s]||0)+1;(yrs[q.s]=yrs[q.s]||new Set()).add(EX[q.ex].year)});
  const ch=Object.keys(cnt).map(c=>({c:+c,n:cnt[c],pct:Math.round(cnt[c]/QS.length*100),per:(cnt[c]/EXAMS.length)})).sort((a,b)=>b.n-a.n);
  const se=Object.keys(sc).map(k=>({k,n:sc[k],y:yrs[k].size})).sort((a,b)=>b.n-a.n);return {ch,se}}

      q.o.map((o,i)=>'<tr class="pick'+cls(i)+'" data-pick="'+i+'"><td class="L">'+LET[i]+'</td>'+o.split(' | ').map(c=>'<td dir="auto">'+fx(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'+
      '<div class="tsel">'+q.o.map((o,i)=>'<button class="opt'+cls(i)+'" data-pick="'+i+'"'+dis+'><span class="L">'+LET[i]+'</span></button>').join('')+'</div>';
  }

  const D=st.reveal&&ST.dist[q.id],tot=D?D.reduce((a,b)=>a+b,0):0,pc=i=>tot>=5?Math.round(D[i]/tot*100):null;
  return '<div class="opts">'+q.o.map((o,i)=>{const P=pc(i);return '<button class="opt'+cls(i)+(P!=null?' hasp':'')+'" data-pick="'+i+'"'+dis+(P!=null?' style="--p:'+P+'%"':'')+'><span class="L">'+LET[i]+'</span><span class="ot" dir="auto">'+fx(o)+'</span>'+(P!=null?'<span class="pc num">'+P+'%</span>':'')+'</button>'}).join('')+'</div>'+(tot>=5?'<div class="pcnote muted">ڕێژەی هەڵبژاردنی <span class="num">'+tot+'</span> قوتابی (یەکەم وەڵامیان)</div>':'');
}

function subGrid(){const L=SUBS.filter(subCount);if(L.length<2)return '';
  return '<div class="sgrid" style="margin-top:14px">'+L.map(k=>{const Q=ALLQS.filter(q=>q.sub===k),st=statsFor(Q),I=SUBIC[k]||['📘','#EEE'];

function fmtN(n){n=+n||0;return n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+' ملیۆن':n>=1e4?Math.round(n/1e3)+' هەزار':n.toLocaleString('en-US')}
function statsCard(){const S=ST.stats;if(!S||S.users<50)return '';
  return '<h2>ئاماری ئەپەکە</h2><div class="grid3"><div class="stat"><div class="v num">'+fmtN(S.users)+'</div><div class="k">قوتابی</div></div><div class="stat"><div class="v num">'+fmtN(S.answers)+'</div><div class="k">وەڵامی دراو</div></div><div class="stat"><div class="v num">'+fmtN(S.questions)+'</div><div class="k">پرسیاری وەزاری</div></div></div>'}
function voicesCard(){const T=ST.stats&&ST.stats.testimonials;if(!T||!T.length)return '';
  return '<h2>قوتابیان دەڵێن</h2><div class="voices">'+T.map(x=>'<div class="voice"><p>«'+esc(x.t)+'»</p>'+(x.n?'<small>— '+esc(x.n)+'</small>':'')+'</div>').join('')+'</div>'}


// ---------- DAILY SCHEDULE ----------
function mkRow(x){return x[0]==='st'?{t:'',k:'st',kd:x[1],sb:0,n:'',d:0}:{t:'',k:'fx',l:x[1],d:0}}
function curDay(){return V.dday||todayStr()}
let SPT=null;
function savePlanSoon(day){V.saveSt='…';clearTimeout(SPT);SPT=setTimeout(()=>savePlanNow(day),900)}
async function savePlanNow(day){const P=ST.plans[day];if(!P)return;const r=await sb.rpc('save_plan',{p_day:day,p_kind:P.kind,p_goal:P.goal||'',p_items:P.items});
  V.saveSt=r.error?'err':'ok';const el=document.getElementById('svst');if(el)el.innerHTML=saveLabel()}
function saveLabel(){return V.saveSt==='…'?'پاشەکەوت دەکرێت…':V.saveSt==='err'?'<span class="lo">پاشەکەوت نەکرا. ئینتەرنێت بپشکنە.</span>':V.saveSt==='ok'?'✓ پاشەکەوت کرا':''}
function needAcc(title){return header(title,'',false,accBtn())+'<div class="wrap"><div class="card stack" style="margin-top:16px"><b>سەرەتا هەژمار دروست بکە</b><span class="muted">ئەم بەشە بەخۆڕاییە. هەژمار پێویستە بۆ ئەوەی زانیارییەکانت پاشەکەوت بن.</span><button class="btn" data-act="joinlb">هەژمار دروست بکە</button><button class="btn alt" data-act="login">چوونەژوورەوە</button></div></div>'}
function viewDaily(){
  if(!ST.user)return needAcc('سەعی ڕۆژانە');
  if(!wrOpen())return wrLocked('سەعی ڕۆژانە');
  if(ST.planOk===false)return header('سەعی ڕۆژانە','',false,accBtn())+'<div class="wrap"><div class="card" style="margin-top:16px">ئەم بەشە هێشتا لە داتابەیس ئامادە نەکراوە (update-2.sql).</div></div>';
  if(V.dtab==='hist')return viewDailyHist();
  if(V.dtab==='stats')return viewDailyStats();
  const day=curDay(),t=todayStr(),P=ST.plans[day];
  let h=header('سەعی ڕۆژانە','خشتەی ڕۆژانەی خوێندن',false,accBtn())+'<div class="wrap">'+(day===t?wrTrialNote('سەعی ڕۆژانە'):'');
  h+='<div class="dnav"><button data-act="dprev"'+(day<=addDays(t,-7)?' disabled':'')+' aria-label="ڕۆژی پێشوو">→</button><div><b>'+fmtDay(day)+'</b><small>'+dayName(day)+' · '+fmtD(day)+'</small></div><button data-act="dnext"'+(day>=addDays(t,7)?' disabled':'')+' aria-label="ڕۆژی دواتر">←</button></div>';
  if(!P||!P.items){
    const prev=Object.keys(ST.plans).filter(d=>d<day&&ST.plans[d].items.length).sort().pop();
    h+='<div class="card stack" style="margin-top:12px"><b>خشتەی ئەم ڕۆژە دروست بکە</b><span class="muted" style="font-size:14px">جۆری ڕۆژەکەت هەڵبژێرە. پاشان دەتوانیت کات و دەرس و هەموو شتێک بگۆڕیت.</span>'+
     '<div class="grid2"><button class="kindbtn" data-act="dtpl" data-k="home"><b>لە ماڵەوە دەخوێنم</b><span>بەیانیان پێداچوونەوە، ئێواران ڤیدیۆ</span></button><button class="kindbtn" data-act="dtpl" data-k="school"><b>دەچمە قوتابخانە</b><span>دوای قوتابخانە خوێندن</span></button></div>'+
     (prev?'<button class="btn alt" data-act="dcopy" data-from="'+prev+'">کۆپیکردنی خشتەی '+fmtDay(prev)+'</button>':'')+'<button class="btn alt" data-act="dtpl" data-k="empty">خشتەی بەتاڵ</button></div>';
    return h+quoteCard()+'</div>'}
  const n=P.items.length,d=P.items.filter(x=>x.d).length;
  h+='<div class="card stack" style="margin-top:12px">'+
   '<div style="display:flex;align-items:center;gap:10px"><div class="bar" style="flex:1;height:10px;margin:0"><i style="width:'+(n?d/n*100:0)+'%"></i></div><b class="num">'+d+'/'+n+'</b></div>'+
   '<div class="muted" style="font-size:12px" id="svst">'+saveLabel()+'</div></div>';
  h+='<div class="phead"><span>کاتژمێر</span><span>چالاکی</span><span>کرا؟</span></div><div class="prows">'+P.items.map((x,i)=>planRow(x,i)).join('')+'</div>';
  h+='<div class="grid3 addrow"><button class="btn alt" data-act="dadd" data-k="st">+ خوێندن</button><button class="btn alt" data-act="dadd" data-k="br">+ پشوو</button><button class="btn alt" data-act="dadd" data-k="fx">+ چالاکی تر</button></div>';
  h+='<p class="muted" style="font-size:13px;text-align:center">مۆبایل لە کاتی خوێندندا بەکارمەهێنە.</p>'+quoteCard()+
   '<button class="btn alt" data-act="dreset" style="margin-top:12px">گۆڕینی جۆری خشتە (ماڵەوە / قوتابخانە)</button>';
  return h+'</div>'}
function planRow(x,i){const done=x.d?' done':'';
  let body;
  const tm='<input type="time" class="ptime" data-pi="'+i+'" data-f="t" value="'+esc(x.t||'')+'" aria-label="کات">';
  if(x.k==='st')body='<div class="pst"><div class="pst2"><select data-pi="'+i+'" data-f="kd" aria-label="جۆر">'+KINDS.map((k,j)=>'<option value="'+j+'"'+(+x.kd===j?' selected':'')+'>'+k+'</option>').join('')+'</select><select data-pi="'+i+'" data-f="sb" aria-label="دەرس">'+SUBJ.map((s,j)=>'<option value="'+j+'"'+(+x.sb===j?' selected':'')+'>'+s+'</option>').join('')+'</select></div></div><div class="pbody"><input type="text" class="pnote" data-pi="'+i+'" data-f="n" maxlength="120" value="'+esc(x.n||'')+'" placeholder="لاپەڕە یان بابەت، وەک: ٢٥–٤٠"></div>';
  else body='<div class="pbody"><input type="text" class="plabel" data-pi="'+i+'" data-f="l" maxlength="80" value="'+esc(x.l||'')+'"></div>';
  return '<div class="prow'+(x.k==='st'?' st':'')+done+'">'+tm+body+'<div class="pact"><button class="pdone" data-act="pdone" data-pi="'+i+'" aria-label="کرا">'+(x.d?'✓':'')+'</button><button class="pdel" data-act="pdel" data-pi="'+i+'" aria-label="سڕینەوە">✕</button></div></div>'}
function quoteCard(){return '<div class="quote"><b>بەردەوامی ڕۆژانە کلیلی سەرکەوتنە</b><p class="ar">«أَحَبُّ الأَعْمَالِ إِلَى اللهِ تَعَالَى أَدْوَمُهَا وَإِنْ قَلَّ»</p><span>خۆشەویستترین کردەوەکان لای خوای گەورە ئەوانەن کە خاوەنەکەی بەردەوام بێت لەسەری، ئەگەرچی کردەوەکە کەمیش بێت.</span></div>'}
function rowText(x){return x.k==='st'?KINDS[+x.kd||0]+' · '+SUBJ[+x.sb||0]+(x.n?' · '+x.n:''):x.l}
function viewDailyHist(){
  const t=todayStr(),days=Object.keys(ST.plans).filter(d=>ST.plans[d].items.length).sort().reverse();
  let h=header('ڕۆژانی پێشوو','هەموو خشتەکانت',false,accBtn())+'<div class="wrap">';
  if(!days.length)return h+'<div class="card empty" style="margin-top:16px">هێشتا هیچ خشتەیەکت دروست نەکردووە.</div></div>';
  h+='<div class="stack" style="margin-top:16px">'+days.map(d=>{const P=ST.plans[d],s=planStat(d);
    return '<details class="lday"><summary><span class="ld">'+dayName(d)+' <span class="num">'+fmtD(d)+'</span>'+(d===t?' <small class="muted">(ئەمڕۆ)</small>':'')+'</span><span class="lm"><span class="num '+pctCls(s.pct)+'">'+s.pct+'%</span>'+(s.pct===100?' '+ic('star','sm gold'):'')+'</span></summary>'+
     P.items.map(x=>'<div class="lit'+(x.d?' dn':'')+'"><span class="lck">'+(x.d?'✓':'')+'</span><span class="lt">'+(x.t?'<b class="num ltr">'+esc(x.t)+'</b> ':'')+esc(rowText(x))+'</span></div>').join('')+
     (d>=addDays(t,-7)?'<button class="btn alt" style="margin-top:8px" data-act="dopen" data-day="'+d+'">کردنەوە و گۆڕین</button>':'')+'</details>'}).join('')+'</div>';
  return h+'</div>'}
function viewDailyStats(){
  const t=todayStr();let h=header('ئاماری سەعی ڕۆژانە','لە یەکەم ڕۆژەوە هەتا وەزاری',false,accBtn())+'<div class="wrap">';
  const w=[];for(let i=6;i>=0;i--){const d=addDays(t,-i),s=planStat(d);w.push({d,p:s?s.pct:0,has:!!s})}
  const d30=Object.keys(ST.plans).filter(d=>d<=t).map(planStat).filter(Boolean),left=Math.max(0,countdown());
  const avg=d30.length?Math.round(d30.reduce((a,x)=>a+x.pct,0)/d30.length):0;
  const bySub={},byKind={};Object.keys(ST.plans).filter(d=>d<=t).forEach(d=>ST.plans[d].items.forEach(x=>{if(x.k==='st'&&x.d){bySub[x.sb]=(bySub[x.sb]||0)+1;byKind[x.kd]=(byKind[x.kd]||0)+1}}));
  const mx=Math.max(1,...Object.values(bySub));
  const full=d30.filter(x=>x.pct===100).length,ps=planStreak();
  const xr=(v,cls,txt,sub)=>'<div class="xrow"><div class="xv num '+(cls||'')+'">'+v+'</div><div class="xt"><b>'+txt+'</b>'+(sub?'<small>'+sub+'</small>':'')+'</div></div>';

function planStreak(){let d=todayStr(),n=0;const ok=x=>{const s=planStat(x);return s&&s.pct>=50};if(!ok(d))d=addDays(d,-1);while(ok(d)){n++;d=addDays(d,-1)}return n}

// ---------- FRIDAY REVIEW (Friday + Saturday) ----------
function isWin(s){const d=dow(s);return d===5||d===6}
function winFri(s){return dow(s)===6?addDays(s,-1):s}
function nextFri(s){return isWin(s)?winFri(s):friFrom(s)}
function wrDue(){const t=todayStr(),lim=isWin(t)?t:nextFri(t);return ST.wr.filter(x=>x.next<=lim)}
function gapWeeks(n){return Math.max(1,n)}
function wrCard(x,canDo){const t=todayStr(),over=x.next<winFri(t)&&isWin(t);
  return '<div class="wcard"><div class="wtop"><b>'+esc(x.pages)+'</b><span class="wn2">پێداچوونەوەی <span class="num">'+x.n+'</span></span></div>'+

   (canDo?'<button class="btn" data-act="wdone" data-id="'+x.id+'">✓ پێداچوونەوەم کرد</button><span class="muted" style="font-size:12px">دەبێتە پێداچوونەوەی <span class="num">'+(x.n+1)+'</span> و دوای <span class="num">'+gapWeeks(x.n+1)+'</span> هەفتە دەگەڕێتەوە.</span>':'')+'</div>'}
function bySubject(list){const g={};list.forEach(x=>{(g[x.subject]=g[x.subject]||[]).push(x)});return SUBJ.filter(s=>g[s]).map(s=>[s,g[s]])}
function deckGrid(act,countOf,subOf){return '<div class="decks">'+SUBJ.map((s,j)=>{const c=countOf(s),sub=subOf(s);return '<button class="deck'+(c?' has':'')+'" data-act="'+act+'" data-s="'+j+'"><b>'+s+'</b><span class="dc num">'+c+'</span><small>'+sub+'</small></button>'}).join('')+'</div>'}

  h+=win?'':'<div class="fri" style="margin-top:16px"><span>ئەمانە هەینی <b>'+fmtD(nf)+'</b> چاوەڕێتن. ئەو ڕۆژە دوگمەی «پێداچوونەوەم کرد» دەردەکەوێت.</span></div>';
  h+='<h2>'+(win?'پێداچوونەوەی ئەمڕۆ':'بۆ هەینی داهاتوو')+' <span class="muted num" style="font-size:15px">('+L.length+')</span></h2>';

  if(win)h+='<h2>زیادکردنی بابەتی نوێی '+sname+'</h2><div class="card stack">'+
   '<div class="grid2"><div class="field"><label for="wfrom">لە لاپەڕە</label><input type="text" id="wfrom" inputmode="numeric" autocomplete="off" value="'+esc(V.wfrom||'')+'"></div><div class="field"><label for="wto">هەتا لاپەڕە</label><input type="text" id="wto" inputmode="numeric" autocomplete="off" value="'+esc(V.wto||'')+'"></div></div>'+
   '<div class="field"><label for="wtxt">یان ناوی بابەت (ئارەزوومەندانە)</label><input type="text" id="wtxt" maxlength="60" value="'+esc(V.wtxt||'')+'" placeholder="بۆ نموونە: بەندی ٤ · دەمارە خانە"></div>'+
   '<button class="btn" data-act="wadd">زیادکردن</button><span class="muted" style="font-size:13px">دەبێتە پێداچوونەوەی ١ و هەینی <b>'+fmtD(addDays(winFri(t),7))+'</b> دەگەڕێتەوە.</span></div>';
  if(later.length)h+='<h2>بابەتەکانی تری '+sname+' <span class="muted num" style="font-size:15px">('+later.length+')</span></h2>'+later.map(x=>wrCard(x,false)).join('');

function plannerClick(a,b){
  const t=todayStr(),day=curDay();
  if(a==='dprev'||a==='dnext'){V.dday=addDays(day,a==='dprev'?-1:1);render();return true}
  if(a==='dtpl'){const k=b.dataset.k;ST.plans[day]={day,kind:k==='school'?'school':'home',goal:'',items:k==='empty'?[mkRow(['st',0])]:TPL[k].map(mkRow)};savePlanSoon(day);render();return true}
  if(a==='dcopy'){const F=ST.plans[b.dataset.from];ST.plans[day]={day,kind:F.kind,goal:'',items:F.items.map(x=>Object.assign({},x,{d:0}))};savePlanSoon(day);render();return true}
  if(a==='dreset'){if(!b.dataset.sure){b.dataset.sure=1;b.textContent='دڵنیایت؟ خشتەی ئەم ڕۆژە دەسڕێتەوە';return true}delete ST.plans[day];sb.from('daily_plan').delete().eq('user_id',ST.user.id).eq('day',day).then(()=>{});render();return true}
  if(a==='pdone'){const P=ST.plans[day],x=P.items[+b.dataset.pi];x.d=x.d?0:1;savePlanSoon(day);render();return true}
  if(a==='pdel'&&b.dataset.pi!=null){const P=ST.plans[day];P.items.splice(+b.dataset.pi,1);savePlanSoon(day);render();return true}
  if(a==='dadd'){const P=ST.plans[day],k=b.dataset.k;P.items.push(k==='st'?mkRow(['st',0]):k==='br'?mkRow(['fx','پشووی کورت']):mkRow(['fx','']));savePlanSoon(day);render();
    setTimeout(()=>{const r=document.querySelectorAll('.prow');if(r.length)r[r.length-1].scrollIntoView({block:'center'})},30);return true}
  if(a==='dopen'){V.dday=b.dataset.day;V.dtab='plan';render();scrollTo(0,0);return true}
  if(a==='wdeck'){V.wdeck=+b.dataset.s;render();scrollTo(0,0);return true}
  if(a==='wadeck'){V.wadeck=+b.dataset.s;render();scrollTo(0,0);return true}
  if(a==='back'&&V.sec==='week'&&!RUN){if(V.wtab==='fri'&&V.wdeck!=null){V.wdeck=null;render();return true}if(V.wtab==='all'&&V.wadeck!=null){V.wadeck=null;render();return true}}
  if(a==='wadd'){const f=digits(V.wfrom||'').trim(),to=digits(V.wto||'').trim(),tx=(V.wtxt||'').trim();
    const pages=((f||to)?'لاپەڕە '+(f||'?')+(to?'–'+to:''):'')+(tx?((f||to)?' · ':'')+tx:'');
    if(!pages){toast('لاپەڕە یان ناوی بابەت بنووسە');return true}
    b.disabled=true;sb.rpc('weekly_add',{p_subject:SUBJ[V.wdeck!=null?V.wdeck:0],p_pages:pages.slice(0,80)}).then(r=>{b.disabled=false;if(r.error){toast(/only friday/.test(r.error.message)?'زیادکردن تەنها هەینی و شەممە':ERR.net);return}ST.wr.push(r.data);ST.wr.sort((x,y)=>x.next.localeCompare(y.next));V.wfrom='';V.wto='';V.wtxt='';render();toast('زیاد کرا')});return true}
  if(a==='wdone'){b.disabled=true;sb.rpc('weekly_done',{p_id:+b.dataset.id}).then(r=>{if(r.error){b.disabled=false;toast(/only friday/.test(r.error.message)?'تەنها ڕۆژانی هەینی و شەممە':ERR.net);return}
    const i=ST.wr.findIndex(z=>z.id==r.data.id);if(i>=0)ST.wr[i]=r.data;render();toast('ئافەرین! هەینی '+fmtD(r.data.next)+' دەگەڕێتەوە')});return true}
  if(a==='wdel'){if(!b.dataset.sure){b.dataset.sure=1;b.textContent='سڕینەوە؟';return true}const id=+b.dataset.id;ST.wr=ST.wr.filter(z=>z.id!==id);render();sb.from('weekly_review').delete().eq('id',id).then(r=>{if(r.error)toast(ERR.net)});return true}
  return false}
function plannerInput(t){

function fcAnswer(ok){const R=V.fcrun,id=R.ids[R.i],t=todayStr();const old=FC.prog[id]?Object.assign({},FC.prog[id]):null,h={id,old,ok:R.ok,bad:R.bad,again:!!R.again[id],len:R.ids.length};(R.hist=R.hist||[]).push(h);let p=FC.prog[id]?Object.assign({},FC.prog[id]):{box:0,due:t,f:t};
  if(ok){if(!R.again[id]){p.box=Math.min(5,p.box+1);R.ok++}p.due=addDays(t,FC_GAP[p.box]||1)}
  else{p.box=1;p.due=addDays(t,1);if(!R.again[id]){R.bad++;R.again[id]=1;R.ids.push(id)}}

  if(h.old)FC.prog[h.id]=h.old;else delete FC.prog[h.id];fcSaveLocal();if(h.old)fcPush(h.id);

  if(a==='fctoday'){fcStart(fcTodayIds(fcCur()),'کارتەکانی ئەمڕۆ · '+subName(FC.sub));return true}
  if(a==='fcdeck'){const ch=+b.dataset.c;const L=fcCards(fcCur()).filter(c=>c.ch===ch&&c.deck===b.dataset.d&&fcOpen(c));if(!L.length){V.lock=1;render();return true}
    const nw=L.filter(c=>fcNew(c.id)||fcDue(c.id)).map(c=>c.id);fcStart(nw.length?nw:shuffle(L.map(c=>c.id)),b.dataset.d);return true}
  if(a==='fcflip'){if(V.fcrun){V.fcrun.flip=V.fcrun.flip?0:1;const el=document.querySelector('.fcard');if(el&&V.fcrun.flip){el.classList.add('on');setTimeout(render,320)}else render()}return true}

  return false}

function dLink(en){if(!DX.idx)return esc(en);return esc(en).replace(/[A-Za-z][A-Za-z'’-]*/g,m=>{const k=m.toLowerCase().replace(/[’']s$/,'');if(DSTOP.has(k))return m;const i=DX.idx[k];return i==null?m:'<span class="dl" data-act="dword" data-w="'+i+'">'+m+'</span>'})}
function dWordRow(i){const x=DX.d.w[i],sv=dSaved().includes(x.w);
  return '<div class="drow"><button class="dmain" data-act="dword" data-w="'+i+'"><b dir="ltr">'+esc(x.w)+'</b><span>'+esc(x.ku)+'</span></button><button class="dic" data-act="dsay" data-t="'+esc(x.w)+'" aria-label="گوێگرتن">'+DSPK+'</button><button class="dic'+(sv?' on':'')+'" data-act="dsave" data-w="'+i+'" aria-label="سەیڤ">'+DSTAR(sv)+'</button></div>'}
function dLang(){if(V.dlang)return V.dlang;let l='en';try{l=localStorage.getItem('klil_dlang')||'en'}catch(e){}return V.dlang=l}
function dSwitch(){const l=dLang();return '<div class="dlang" role="tablist"><button data-act="dlang" data-l="en"'+(l==='en'?' aria-current="page"':'')+'><b dir="ltr">English</b><span>ئینگلیزی ← کوردی</span></button><button data-act="dlang" data-l="ar"'+(l==='ar'?' aria-current="page"':'')+'><b class="ar">العربية</b><span>عەرەبی ← کوردی</span></button></div>'}
function viewDict(){
  if(dLang()==='ar')return viewDictAr();
  if(!DX.d){dLoad();return header('فەرهەنگەکان','ئینگلیزی و عەرەبی بە کوردی',true,accBtn())+'<div class="wrap">'+dSwitch()+'<div class="card" style="text-align:center;margin-top:20px">'+(DX.err?'نەتوانرا فەرهەنگەکە باربکرێت. ئینتەرنێتەکەت بپشکنە.<div style="margin-top:12px"><button class="btn" data-act="dretry">دووبارە هەوڵ بدەرەوە</button></div>':'فەرهەنگ باردەکرێت…')+'</div></div>'}
  const t=V.dt||'words';
  if(t==='read'&&V.dr)return viewDictRead();
  if(V.drev)return viewDictRev();
  let h=header('فەرهەنگەکان','ئینگلیزی و عەرەبی بە کوردی',true,accBtn())+'<div class="wrap">'+dSwitch();
  h+='<div class="dtabs t4"><button data-act="dtab" data-t="words"'+(t==='words'?' aria-current="page"':'')+'>وشەکان</button><button data-act="dtab" data-t="read"'+(t==='read'?' aria-current="page"':'')+'>خوێندنەوە</button><button data-act="dtab" data-t="gram"'+(t==='gram'?' aria-current="page"':'')+'>ڕستە و یاسا</button><button data-act="dtab" data-t="saved"'+(t==='saved'?' aria-current="page"':'')+'>سەیڤ'+(dSaved().length?' <span class="num">('+dSaved().length+')</span>':'')+'</button></div>';
  if(t==='words'){
    h+='<div class="dsearch"><input type="search" id="dq" dir="auto" placeholder="وشەیەکی کتێبەکەت بنووسە…" value="'+esc(V.dq||'')+'" autocomplete="off" autocapitalize="off" spellcheck="false"></div>';
    const q=(V.dq||'').trim().toLowerCase();
    if(q){const W=DX.d.w,hit=[];W.forEach((x,i)=>{const w=x.w.toLowerCase();let s=w===q?0:w.startsWith(q)?1:w.includes(q)?2:x.ku.includes(q)?3:9;if(s<9)hit.push([s,w.length,i])});
      hit.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
      h+=hit.length?'<div class="dlist">'+hit.slice(0,60).map(z=>dWordRow(z[2])).join('')+'</div>':'<div class="card muted" style="text-align:center">ئەم وشەیە لە کتێبەکەدا نییە.</div>'}
    else if(V.dg){const L=DX.d.w.map((x,i)=>[x,i]).filter(z=>dSrcKey(z[0].u)===V.dg);
      h+='<div class="dgh"><button class="linkbtn" data-act="dgrp" data-g="">‹ هەموو بەشەکان</button><b dir="ltr">'+esc(DSRC[V.dg]||V.dg)+'</b><span class="muted"><span class="num">'+L.length+'</span> وشە</span></div><div class="dlist">'+L.map(z=>dWordRow(z[1])).join('')+'</div>'}
    else{const G={};DX.d.w.forEach(x=>{const k=dSrcKey(x.u);G[k]=(G[k]||0)+1});
      const order=['U1','U2','U3','U4','U5','U6','U7','U8','E1','E2','E3','E4','E5','E6','E7','E8','TW'].filter(k=>G[k]);
      h+='<p class="muted" style="font-size:14px;margin:4px 2px 10px">'+'<span class="num">'+DX.d.w.length+'</span> وشەی کتێبی Sunrise 12، هەریەکە بە مانای کوردی و دەنگی بەریتانی.</p>';
      h+='<h2>بەشەکانی کتێب</h2><div class="stack">'+order.filter(k=>k[0]==='U').map(k=>'<button class="row deckrow" data-act="dgrp" data-g="'+k+'"><div class="ix num">'+k.slice(1)+'</div><div class="tx"><b dir="ltr" style="text-align:right">'+esc(DSRC[k])+'</b><span><span class="num">'+G[k]+'</span> وشە</span></div></button>').join('')+'</div>';
      h+='<h2>Treasure Island</h2><div class="stack">'+order.filter(k=>k[0]==='E'||k==='TW').map(k=>'<button class="row deckrow" data-act="dgrp" data-g="'+k+'"><div class="ix num">'+(k==='TW'?'★':k.slice(1))+'</div><div class="tx"><b dir="ltr" style="text-align:right">'+esc(DSRC[k])+'</b><span><span class="num">'+G[k]+'</span> وشە</span></div></button>').join('')+'</div>'}
  }else if(t==='read'){
    const C={},T={};DX.d.s.forEach(s=>{if(s.h||s.x)return;C[s.u]=(C[s.u]||0)+1;if(s.ku)T[s.u]=(T[s.u]||0)+1});
    const ks=['U1','U2','U3','U4','U5','U6','U7','U8','TI','E1','E2','E3','E4','E5','E6','E7','E8'].filter(k=>C[k]);
    h+='<p class="muted" style="font-size:14px;margin:4px 2px 10px">هەموو بابەتەکانی کتێب، ڕستە بە ڕستە بە کوردی. کرتە لە هەر وشەیەکی ئینگلیزی بکە بۆ بینینی ماناکەی.</p><div class="stack">'+
      ks.map(k=>'<button class="row deckrow" data-act="dread" data-r="'+k+'"><div class="ix num">'+(k==='TI'?'★':k.slice(1))+'</div><div class="tx"><b dir="ltr" style="text-align:right">'+esc(DSRC[k])+'</b><span><span class="num">'+C[k]+'</span> ڕستە'+(T[k]&&T[k]<C[k]?' · <span class="num">'+T[k]+'</span> وەرگێڕدراو':'')+(!T[k]?' · وەرگێڕان بەم زووانە':'')+'</span></div></button>').join('')+'</div>';
  }else if(t==='gram'){
    const U=[...new Set([...(DX.d.g||[]),...(DX.d.gs||[])].map(x=>x.u))];const cu=V.dgu&&U.includes(V.dgu)?V.dgu:U[0];
    h+='<div class="fochips agu">'+U.map(u=>'<button data-act="dgu" data-u="'+u+'" aria-pressed="'+(u===cu)+'">'+(u==='TW'?'Treasure Island':'یەکەی '+u.slice(1))+'</button>').join('')+'</div>';
    const Gs=(DX.d.g||[]).filter(x=>x.u===cu),Ss=(DX.d.gs||[]).filter(x=>x.u===cu);
    h+='<b dir="ltr" style="display:block;text-align:right;margin:2px 2px 4px">'+esc(DSRC[cu]||cu)+'</b>';
    if(Gs.length)h+='<h2>یاساکانی ڕێزمان · Grammar</h2><div class="stack">'+Gs.map(g=>'<div class="card agr"><b>'+esc(g.t)+'</b><p>'+esc(g.ku)+'</p>'+(g.ex?'<div class="dex"><div class="den" dir="ltr">'+dLink(g.ex)+'</div></div>':'')+'</div>').join('')+'</div>';
    if(Ss.length)h+='<h2 style="margin-top:16px">ڕستە گرنگەکان</h2><div class="stack">'+Ss.map(x=>'<div class="card agr"><div class="den" dir="ltr">'+dLink(x.en)+' <button class="dic sm" data-act="dsay" data-t="'+esc(x.en)+'">'+DSPK+'</button></div><p>'+esc(x.ku)+'</p>'+(x.n?'<small class="muted">'+esc(x.n)+'</small>':'')+'</div>').join('')+'</div>';
    if(!Gs.length&&!Ss.length)h+='<div class="card muted" style="text-align:center">هێشتا هیچ نییە.</div>';
  }else{
    const L=dSaved().map(w=>DX.d.w.findIndex(x=>x.w===w)).filter(i=>i>=0);
    h+=L.length?'<button class="btn" data-act="drev" style="margin:4px 0 12px">پێداچوونەوەی وشە سەیڤکراوەکان (<span class="num">'+L.length+'</span>)</button><div class="dlist">'+L.map(dWordRow).join('')+'</div>'
      :'<div class="card muted" style="text-align:center;line-height:1.9">هێشتا هیچ وشەیەکت سەیڤ نەکردووە.<br>کرتە لە ئەستێرەی تەنیشت هەر وشەیەک بکە بۆ سەیڤکردنی.</div>';
  }
  return h+'</div>'+(V.dw!=null?dWordSheet(V.dw):'')}
function dWordSheet(i){const x=DX.d.w[i],sv=dSaved().includes(x.w),pos=x.pos.split('/').map(p=>DPOS[p]||p).join(' / ');
  const ex=(x.ex||[]).map(j=>{const s=DX.d.s[j];return '<div class="dex"><div class="den" dir="ltr">'+dLink(s.en)+' <button class="dic sm" data-act="dsay" data-t="'+esc(s.en)+'">'+DSPK+'</button></div>'+(s.ku?'<div class="dku">'+esc(s.ku)+'</div>':'')+'<small class="muted" dir="ltr">'+esc(DSRC[s.u]||s.u)+(s.p?' · p. '+s.p:'')+'</small></div>'}).join('');
  return '<div class="sheet full dfull" id="dsx"><div class="box dsheet"><div class="dtop"><button class="dback" data-act="dclose" aria-label="گەڕانەوە"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button><b>فەرهەنگی ئینگلیزی</b></div><div class="dhead"><div><b class="dw" dir="ltr">'+esc(x.w)+'</b><div class="dipa" dir="ltr">/'+esc(x.ipa)+'/ <span class="dbr">BrE</span></div></div><button class="dic big" data-act="dsay" data-t="'+esc(x.w)+'" aria-label="گوێگرتن">'+DSPK+'</button></div>'+
   (x.kp?'<div class="dkp"><span class="muted">بەم شێوەیە دەخوێنرێتەوە:</span> <b>'+esc(x.kp)+'</b></div>':'')+'<button class="btn alt sm" style="margin-top:8px" data-act="dslow" data-t="'+esc(x.w)+'">'+DSPK+' گوێگرتن بە هێواشی</button>'+
   '<div class="dmean"><small class="muted">'+esc(pos)+'</small><p>'+esc(x.ku)+'</p>'+(x.f?'<small class="muted" dir="auto" style="display:block">'+esc(x.f)+'</small>':'')+'</div>'+
   (ex?'<h3 class="dh3">لە ناو کتێبدا</h3>'+ex:'')+
   '<small class="muted" style="display:block;margin-top:8px" dir="ltr">'+esc(DSRC[dSrcKey(x.u)]||x.u)+'</small>'+
   '<div class="grid2" style="margin-top:14px"><button class="btn'+(sv?' alt':'')+'" data-act="dsave" data-w="'+i+'">'+(sv?'لابردن لە سەیڤکراوەکان':'سەیڤکردن')+'</button><button class="btn alt" data-act="dclose">گەڕانەوە</button></div></div></div>'}
function viewDictRead(){const k=V.dr,L=DX.d.s.map((s,j)=>[s,j]).filter(z=>z[0].u===k&&!z[0].x);let lastp=null,h=header(DSRC[k]||k,'خوێندنەوە · Sunrise 12',true)+'<div class="wrap">';
  h+='<div class="dread-tools"><label><input type="checkbox" data-act="dkutog"'+(V.dkuoff?'':' checked')+'> وەرگێڕانی کوردی</label><button class="btn alt sm" data-act="dsayall">'+DSPK+' خوێندنەوەی هەمووی</button></div>';
  h+='<div class="dread">'+L.map(([s,j])=>{let pg='';if(s.p!==lastp){pg='<div class="dpg" dir="ltr">p. '+s.p+'</div>';lastp=s.p}
    if(s.h)return pg+'<h3 class="dsh" dir="ltr">'+esc(s.en)+(s.ku?'<span>'+esc(s.ku)+'</span>':'')+'</h3>';
    return pg+'<div class="dsent'+(V.dplay===j?' play':'')+'" id="ds'+j+'"><div class="den" dir="ltr">'+(s.sp?'<b class="dsp">'+esc(s.sp)+':</b> ':'')+dLink(s.en)+' <button class="dic sm" data-act="dsay" data-t="'+esc(s.en)+'" data-j="'+j+'">'+DSPK+'</button></div>'+(s.ku&&!V.dkuoff?'<div class="dku">'+esc(s.ku)+'</div>':'')+'</div>'}).join('')+'</div>';
  return h+'</div>'+(V.dw!=null?dWordSheet(V.dw):'')}
function viewDictRev(){const R=V.drev;if(R.i>=R.ids.length){return header('پێداچوونەوە','وشە سەیڤکراوەکان',true)+'<div class="wrap"><div class="card" style="text-align:center;margin-top:16px"><b style="font-size:20px">تەواو بوو!</b><p class="muted">هەموو وشە سەیڤکراوەکانت بینی.</p><button class="btn" data-act="drevend">گەڕانەوە</button></div></div>'}
  const x=DX.d.w[R.ids[R.i]];
  return header('پێداچوونەوە','وشەی '+(R.i+1)+' لە '+R.ids.length,true)+'<div class="wrap"><button class="drcard'+(R.flip?' on':'')+'" data-act="drflip"><b dir="ltr">'+esc(x.w)+'</b><span class="dipa" dir="ltr">/'+esc(x.ipa)+'/</span>'+(R.flip?'<p>'+esc(x.ku)+'</p><small>'+esc(x.kp)+'</small>':'<small class="muted">کرتە بکە بۆ مانا</small>')+'</button>'+
    '<div class="grid2" style="margin-top:12px"><button class="btn alt" data-act="dsay" data-t="'+esc(x.w)+'">'+DSPK+' گوێگرتن</button><button class="btn" data-act="drnext">دواتر</button></div></div>'}
function dictClick(a,b){
  if(a==='dlang'){V.dlang=b.dataset.l;try{localStorage.setItem('klil_dlang',V.dlang)}catch(e){}try{speechSynthesis.cancel()}catch(e){}render();scrollTo(0,0);return true}
  if(a[0]==='a'&&aClick(a,b))return true;
  if(a==='dtab'){V.dt=b.dataset.t;V.dg=null;V.dr=null;render();scrollTo(0,0);return true}
  if(a==='dgu'){V.dgu=b.dataset.u;render();return true}
  if(a==='dgrp'){V.dg=b.dataset.g||null;render();scrollTo(0,0);return true}
  if(a==='dword'){V.dw=+b.dataset.w;render();return true}
  if(a==='dclose'){V.dw=null;render();return true}
  if(a==='dsay'){dSay(b.dataset.t);if(b.dataset.j){V.dplay=+b.dataset.j;document.querySelectorAll('.dsent.play').forEach(e=>e.classList.remove('play'));const e=document.getElementById('ds'+b.dataset.j);if(e)e.classList.add('play')}return true}
  if(a==='dslow'){dSay(b.dataset.t,1);return true}
  if(a==='dsave'){const x=DX.d.w[+b.dataset.w];let L=dSaved();if(L.includes(x.w)){L=L.filter(w=>w!==x.w);toast('لابرا')}else{L.push(x.w);toast('سەیڤ کرا')}dSetSaved(L);render();return true}
  if(a==='dread'){V.dr=b.dataset.r;V.dw=null;render();scrollTo(0,0);return true}
  if(a==='dkutog'){V.dkuoff=!V.dkuoff;render();return true}
  if(a==='dsayall'){const L=DX.d.s.filter(s=>s.u===V.dr&&!s.h).map(s=>s.en);dSay(L.join(' '));return true}
  if(a==='drev'){const L=dSaved().map(w=>DX.d.w.findIndex(x=>x.w===w)).filter(i=>i>=0);V.drev={ids:shuffle(L),i:0,flip:0};render();scrollTo(0,0);return true}
  if(a==='drflip'){V.drev.flip=V.drev.flip?0:1;render();return true}
  if(a==='drnext'){V.drev.i++;V.drev.flip=0;render();return true}
  if(a==='drevend'){V.drev=null;render();return true}
  if(a==='dretry'){DX.err=0;dLoad();render();return true}
  return false}
function dictBack(){if(V.sec!=='dict')return false;
  if(dLang()==='ar'){if(V.aw!=null){V.aw=null;render();return true}if(V.arev){V.arev=null;render();return true}if(V.ag){V.ag=null;render();scrollTo(0,0);return true}return false}
  if(V.dg&&!V.dw){V.dg=null;render();scrollTo(0,0);return true}
  if(V.dw!=null){V.dw=null;render();return true}
  if(V.drev){V.drev=null;render();return true}
  if(V.dr){V.dr=null;try{speechSynthesis.cancel()}catch(e){}render();scrollTo(0,0);return true}
  return false}
app.addEventListener('input',e=>{if(e.target.id==='dq'){V.dq=e.target.value;V.dg=null;render()}else if(e.target.id==='aq'){V.aq=e.target.value;V.ag=null;render();const i=document.getElementById('aq');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}});
app.addEventListener('click',e=>{if(e.target.id==='dsx'){V.dw=null;render()}else if(e.target.id==='asx'){V.aw=null;render()}});

// ---------- ARABIC-KURDISH DICTIONARY (grade 12 Arabic book) ----------
const AX={d:null,loading:0,err:0};
function aSaved(){try{return JSON.parse(localStorage.getItem('klil_dsave_ar')||'[]')}catch(e){return []}}
function aSetSaved(L){try{localStorage.setItem('klil_dsave_ar',JSON.stringify(L))}catch(e){}}
function aLoad(){if(AX.d||AX.loading||AX.err)return;AX.loading=1;
  fetch('dict-ar.json?v=2').then(r=>r.json()).then(d=>{AX.d=d;AX.loading=0;if(V.sec==='dict')render()}).catch(()=>{AX.loading=0;AX.err=1;if(V.sec==='dict')render()})}
function aBare(t){return String(t||'').replace(/[ً-ْٰـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').trim()}
let AVOICE=null;
function aPickVoice(){if(!('speechSynthesis' in window))return null;const vs=speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang));
  const pref=[/Google.*ar|العربية/i,/Maged|Tarik|Laila|Mariam|Hamed|Zariyah/i,/SA|Saudi/i];for(const p of pref){const v=vs.find(v=>p.test(v.name)||p.test(v.lang));if(v)return v}return vs[0]||null}
function aSay(t,slow){if(!('speechSynthesis' in window)){toast('ئەم مۆبایلە دەنگی تێدا نییە');return}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';AVOICE=AVOICE||aPickVoice();if(AVOICE)u.voice=AVOICE;else toast('ئەگەر دەنگ نەهات، زمانی عەرەبی لە ڕێکخستنی دەنگی مۆبایلەکەت دابەزێنە');u.rate=slow?0.6:0.85;speechSynthesis.speak(u)}catch(e){}}
if('speechSynthesis' in window){try{const f=speechSynthesis.onvoiceschanged;speechSynthesis.onvoiceschanged=()=>{if(f)f();AVOICE=aPickVoice()}}catch(e){}}
function aSrc(k){const s=AX.d.src[k];return s?s:{t:k,a:'',g:''}}
function aKey(i){const x=AX.d.w[i];return x.u+'|'+x.w}
function aSavedIdx(){if(!AX.d)return [];const L=aSaved();return L.map(k=>AX.d.w.findIndex((x,i)=>aKey(i)===k)).filter(i=>i>=0)}
function aRow(i){const x=AX.d.w[i],sv=aSaved().includes(aKey(i));
  return '<div class="drow"><button class="dmain" data-act="aword" data-w="'+i+'"><b class="ar">'+esc(x.w)+(x.x?' <i class="axb">وزاری</i>':'')+'</b><span>'+esc(x.ku)+'</span></button><button class="dic'+(sv?' on':'')+'" data-act="asave" data-w="'+i+'" aria-label="سەیڤ">'+DSTAR(sv)+'</button></div>'}
function viewDictAr(){
  const hd=header('فەرهەنگەکان','ئینگلیزی و عەرەبی بە کوردی',true,accBtn())+'<div class="wrap">'+dSwitch();
  if(!AX.d){aLoad();return hd+'<div class="card" style="text-align:center;margin-top:8px">'+(AX.err?'نەتوانرا فەرهەنگەکە باربکرێت. ئینتەرنێتەکەت بپشکنە.<div style="margin-top:12px"><button class="btn" data-act="aretry">دووبارە هەوڵ بدەرەوە</button></div>':'فەرهەنگ باردەکرێت…')+'</div></div>'}

const ZKN={1:'یەک جار',3:'سێ جار',4:'چوار جار',7:'حەوت جار',10:'دە جار',100:'سەد جار'};
function zkList(t){return ZK.map((z,i)=>({i,tx:t==='m'?z[0]:(z[1]==null?z[0]:z[1]),n:z[2],note:z[3]||''})).filter(z=>z.tx)}
function zkDefault(){const h=new Date().getHours();return (h>=4&&h<14)?'m':'e'}
function zkKey(t){return 'klil_zk_'+t+'_'+todayStr()}
function zkGet(t){try{return JSON.parse(localStorage.getItem(zkKey(t))||'{}')}catch(e){return {}}}
function zkSet(t,o){try{localStorage.setItem(zkKey(t),JSON.stringify(o))}catch(e){}}
function zkProg(t){const L=zkList(t),C=zkGet(t);let d=0;L.forEach(z=>{if((C[z.i]||0)>=z.n)d++});return {d,n:L.length}}
function zkTile(){const t=zkDefault(),p=zkProg(t);return (t==='m'?'زیکری بەیانیان':'زیکری ئێواران')+' · <span class="num">'+p.d+'</span> لە <span class="num">'+p.n+'</span>'}
function viewZikr(){const dt=V.dt||'p';
  let h=header('بەشی ئاینی',dt==='q'?'قورئانی پیرۆز':dt==='z'?'زیکری بەیانیان و ئێواران':'کاتەکانی بانگ · '+prLoc().n,true,accBtn())+'<div class="wrap">';
  h+='<div class="dtabs dint"><button data-act="dtab2" data-t="p"'+(dt==='p'?' aria-current="page"':'')+'>'+ic('clock')+' کاتی بانگ</button><button data-act="dtab2" data-t="q"'+(dt==='q'?' aria-current="page"':'')+'>'+ic('book')+' قورئان</button><button data-act="dtab2" data-t="z"'+(dt==='z'?' aria-current="page"':'')+'>'+ic('beads')+' زیکرەکان</button></div>';
  return h+(dt==='q'?viewQuran():dt==='z'?viewAzkar():viewPray())+'</div>'}
function viewAzkar(){const t=V.zt||zkDefault(),L=zkList(t),C=zkGet(t),p=zkProg(t);
  let h='<div class="dtabs zt2"><button data-act="ztab" data-t="m"'+(t==='m'?' aria-current="page"':'')+'>زیکری بەیانیان</button><button data-act="ztab" data-t="e"'+(t==='e'?' aria-current="page"':'')+'>زیکری ئێواران</button></div>';
  h+='<div class="zkbar"><div class="bar"><i style="width:'+(p.n?p.d/p.n*100:0)+'%"></i></div><span class="muted"><span class="num">'+p.d+'</span> / <span class="num">'+p.n+'</span>'+(p.d===p.n?' · خوا لێت قبووڵ بکات':'')+'</span></div>';
  h+='<div class="stack zkl">'+L.map(z=>{const c=Math.min(C[z.i]||0,z.n),done=c>=z.n;
    return '<div class="zk'+(done?' done':'')+'"><p class="ztx" lang="ar" dir="rtl">'+esc(z.tx).replace(/\n/g,'<br>')+'</p>'+
      '<div class="zfoot"><span class="zn">'+(z.note||'('+(ZKN[z.n]||z.n+' جار')+')')+'</span>'+
      '<button class="zbtn" data-act="zinc" data-i="'+z.i+'" aria-label="ژماردن">'+(done?'✓':'<b class="num">'+c+'</b><small>/'+z.n+'</small>')+'</button></div></div>'}).join('')+'</div>';
  return h+'<button class="btn alt" style="margin:16px 0" data-act="zreset">دەستپێکردنەوەی ژماردن</button>'}

// ---------- prayer times: worked out on the phone (Muslim World League angles, Shafi'i asr) ----------
const PCITY=[['هەولێر',36.19,44.01],['سلێمانی',35.56,45.44],['دهۆک',36.87,42.99],['هەڵەبجە',35.18,45.99],['کەرکووک',35.47,44.39],['زاخۆ',37.14,42.68],['سۆران',36.65,44.54],['سیدەکان',36.80,44.67],['ڕانیە',36.25,44.88],['کۆیە',36.08,44.63],['ئاکرێ',36.74,43.89],['شەقڵاوە',36.40,44.33],['چەمچەماڵ',35.53,44.83],['کەلار',34.63,45.32],['پێنجوێن',35.62,45.94],['قەڵادزێ',36.18,45.13],['خانەقین',34.35,45.39],['مووسڵ',36.34,43.13],['بەغدا',33.31,44.36]];
const PNAME={f:'بەیانی',s:'خۆرهەڵاتن',d:'نیوەڕۆ',a:'عەسر',m:'ئێوارە',i:'خەوتنان'};
function prSet(){return Object.assign({c:0,on:false},load('klil_pray',{}))}
function prPut(o){save('klil_pray',Object.assign(prSet(),o))}
function prLoc(){const S=prSet();if(S.c==='gps'&&S.lat!=null)return {n:'شوێنی خۆم',lat:S.lat,lng:S.lng,tz:S.tz};const c=PCITY[S.c]||PCITY[0];return {n:c[0],lat:c[1],lng:c[2],tz:3}}
function prTimes(d,L){const R=Math.PI/180,sin=x=>Math.sin(x*R),cos=x=>Math.cos(x*R),tan=x=>Math.tan(x*R),asin=x=>Math.asin(x)/R,acos=x=>Math.acos(Math.max(-1,Math.min(1,x)))/R,atan2=(y,x)=>Math.atan2(y,x)/R,acot=x=>Math.atan(1/x)/R,fix=(a,b)=>a-b*Math.floor(a/b);
  const y=d.getFullYear(),mo=d.getMonth()+1,dy=d.getDate();let Y=y,M=mo;if(M<=2){Y--;M+=12}const A=Math.floor(Y/100),B=2-A+Math.floor(A/4);
  const jd=Math.floor(365.25*(Y+4716))+Math.floor(30.6001*(M+1))+dy+B-1524.5-L.lng/(15*24);
  const sun=t=>{const D=jd+t-2451545,g=fix(357.529+0.98560028*D,360),q=fix(280.459+0.98564736*D,360),l=fix(q+1.915*sin(g)+0.020*sin(2*g),360),e=23.439-0.00000036*D,ra=fix(atan2(cos(e)*sin(l),cos(l))/15,24);return {dec:asin(sin(e)*sin(l)),eq:q/15-ra}};
  const mid=t=>fix(12-sun(t).eq,24);
  const ang=(a,t,ccw)=>{const dec=sun(t).dec,T=acos((-sin(a)-sin(dec)*sin(L.lat))/(cos(dec)*cos(L.lat)))/15;return mid(t)+(ccw?-T:T)};
  const asr=t=>{const dec=sun(t).dec;return ang(-acot(1+tan(Math.abs(L.lat-dec))),t)};
  let T={f:5,s:6,d:12,a:13,m:18,i:18};
  for(let k=0;k<2;k++)T={f:ang(18,T.f/24,1),s:ang(0.833,T.s/24,1),d:mid(T.d/24),a:asr(T.a/24),m:ang(0.833,T.m/24),i:ang(17,T.i/24)};
  const o={};for(const k in T){const h=T[k]+L.tz-L.lng/15+(k==='d'?1/60:0);o[k]=new Date(Date.UTC(y,mo-1,dy)+Math.round((h-L.tz)*60)*60000)}return o}
function prFmt(t,L){const d=new Date(t.getTime()+L.tz*3600000);let h=d.getUTCHours(),m=d.getUTCMinutes();h=h%12||12;return h+':'+String(m).padStart(2,'0')}
function prNext(){const L=prLoc(),now=new Date();for(let k=0;k<2;k++){const d=new Date(now.getTime()+k*864e5),T=prTimes(d,L);for(const x of ['f','d','a','m','i'])if(T[x]>now)return {k:x,t:T[x]}}return null}
function prLeft(t){const s=Math.max(0,Math.round((t-new Date())/60000)),h=Math.floor(s/60),m=s%60;return (h?h+' کاتژمێر و ':'')+m+' خولەک'}
function prTile(){const n=prNext();return n?'بانگی '+PNAME[n.k]+' · '+prFmt(n.t,prLoc()):'قورئان · زیکر · کاتی بانگ'}
function viewPray(){const L=prLoc(),S=prSet(),T=prTimes(new Date(),L),n=prNext();
  clearTimeout(viewPray.t);viewPray.t=setTimeout(()=>{if(V.sec==='zikr'&&(V.dt||'p')==='p'&&!document.querySelector('.sheet'))render()},60000);
  let h='<div class="prnow"><small>بانگی داهاتوو</small><b>'+(n?PNAME[n.k]:'')+'</b><span class="num">'+(n?prFmt(n.t,L):'')+'</span><em>'+(n?'ماوە: '+prLeft(n.t):'')+'</em></div>';
  h+='<div class="prlist">'+['f','s','d','a','m','i'].map(k=>'<div class="prr'+(n&&n.k===k&&n.t.toDateString()===T[k].toDateString()?' on':'')+(k==='s'?' sun':'')+'"><span>'+PNAME[k]+'</span><b class="num">'+prFmt(T[k],L)+'</b></div>').join('')+'</div>';
  h+='<div class="card stack" style="margin-top:12px"><b>شار</b><select class="prsel" onchange="prCity(this.value)">'+PCITY.map((c,i)=>'<option value="'+i+'"'+(S.c===i?' selected':'')+'>'+c[0]+'</option>').join('')+'<option value="gps"'+(S.c==='gps'?' selected':'')+'>شوێنی خۆم (GPS)</option></select>'+
   '<button class="mrow prnot" data-act="prnot"><span class="mti">'+ic('bell')+'</span><span class="mt">ئاگادارکردنەوە لە کاتی بانگ</span><span class="tgl'+(S.on?' on':'')+'"><i></i></span></button>'+
   '<small class="muted">کاتەکان لەسەر مۆبایلەکەت دەژمێردرێن (شێوازی ڕابیتەی جیهانی ئیسلامی). لەوانەیە یەک دوو خولەک جیاوازییان هەبێت لەگەڵ ڕۆژژمێری مزگەوتەکەت. ئاگادارکردنەوەکان بۆ ٧ ڕۆژ دادەنرێن، هەفتەی جارێک ئەپەکە بکەرەوە.</small></div>';
  return h}
window.prCity=function(v){if(v==='gps'){if(!navigator.geolocation){toast('مۆبایلەکەت شوێن نادۆزێتەوە');render();return}
    navigator.geolocation.getCurrentPosition(p=>{prPut({c:'gps',lat:+p.coords.latitude.toFixed(3),lng:+p.coords.longitude.toFixed(3),tz:-new Date().getTimezoneOffset()/60});prPlan(1);render()},()=>{toast('ڕێگەی شوێن نەدرا');render()},{timeout:15000});return}
  prPut({c:+v});prPlan(1);render()};
async function prPlan(force){const S=prSet();if(!sb||!ST.user)return;const t=todayStr();if(!force&&S.pl===t)return;
  const L=prLoc(),jobs=[];if(S.on){for(let k=0;k<8;k++){const T=prTimes(new Date(Date.now()+k*864e5),L);['f','d','a','m','i'].forEach(x=>{if(T[x]>new Date())jobs.push({at:T[x].toISOString(),title:'🕌 کاتی بانگی '+PNAME[x],body:L.n+' · '+prFmt(T[x],L)})})}}
  if(S.on&&!(await pushReady(false)))return;try{const r=await sb.rpc('push_plan',{p_tag:'pray',p_jobs:jobs.slice(0,40)});if(!r.error)prPut({pl:t})}catch(e){}}
(function prBoot(){if(ST.ready&&sb&&ST.user){if(prSet().on)prPlan(0);return}setTimeout(prBoot,4000)})();

// ---------- Quran: text from api.alquran.cloud (Uthmani script + Kurdish translation), kept on the phone once read ----------
const QR={meta:null,s:{},err:null};
async function qGet(u){try{if('caches' in window){const c=await caches.open('klil-quran');const m=await c.match(u);if(m)return await m.json();const r=await fetch(u);if(!r.ok)throw 0;c.put(u,r.clone());return await r.json()}const r=await fetch(u);if(!r.ok)throw 0;return await r.json()}catch(e){return null}}
async function qMeta(){if(QR.meta||QR.mb)return;QR.mb=1;const c=load('klil_qmeta',null);if(c){QR.meta=c;QR.mb=0;return}
  const j=await qGet('https://api.alquran.cloud/v1/surah');QR.mb=0;if(j&&j.data){QR.meta=j.data.map(x=>[x.number,x.name,x.englishName,x.numberOfAyahs,x.revelationType]);save('klil_qmeta',QR.meta)}else QR.err=1;if(V.sec==='zikr')render()}
async function qSurah(n){if(QR.s[n]||QR.s[n]===0)return;QR.s[n]=0;
  const [a,t]=await Promise.all([qGet('https://api.alquran.cloud/v1/surah/'+n+'/quran-uthmani'),qGet('https://api.alquran.cloud/v1/surah/'+n+'/ku.asan')]);
  if(a&&a.data){const tr=t&&t.data?t.data.ayahs:[];QR.s[n]=a.data.ayahs.map((x,i)=>[x.numberInSurah,x.text,tr[i]?tr[i].text:''])}else{delete QR.s[n];QR.err=1}if(V.sec==='zikr')render()}
window.qGo=function(v){V.qs=+v;const Q=load('klil_q',{tr:1,fs:24});Q.last=V.qs;save('klil_q',Q);render();scrollTo(0,0)};
