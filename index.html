/* Layout: phone-first single column, white sticky header, bottom tabs. One deliberate light theme (warm white + navy + gold) so phones that force dark mode don't repaint it. */
:root{
  --bg:#F7F5F0; --surface:#FFFFFF; --surface2:#F1EDE4; --line:#E6E0D3;
  --fg:#14213D; --muted:#667085; --brand:#14284F; --brandfg:#FFFFFF; --gold:#D49B1E; --goldsoft:#FBF1D9;
  --good:#1D8A5A; --goodsoft:#E4F4EC; --bad:#C2413A; --badsoft:#FBE9E7;
  --shadow:0 1px 2px rgba(20,33,61,.05),0 4px 14px rgba(20,33,61,.05);
  --f:'VZ','Vazirmatn',Tahoma,'Segoe UI',sans-serif; --r:18px; color-scheme:only light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--f);font-size:16px;line-height:1.7;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 112px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(255,255,255,.96);color:var(--fg);border-bottom:1px solid var(--line);backdrop-filter:saturate(1.4) blur(8px)}
header.top .in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
header.top .t{flex:1;min-width:0;line-height:1.3}
header.top small{display:block;color:var(--gold);font-weight:800;font-size:12px}
header.top b{font-size:18px;font-weight:900}
header.top .back{background:var(--surface2);border:0;border-radius:12px;width:40px;height:40px;color:inherit;font-size:20px}
.pill{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--gold);color:#16233F;white-space:nowrap}
h2{font-size:20px;font-weight:900;margin:22px 0 10px;text-wrap:balance}
h3{font-size:16px;font-weight:800;margin:0}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero{margin-top:16px;background:var(--brand);color:var(--brandfg);border-radius:20px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.hero .ring{width:92px;height:92px}
.hero .k{color:var(--gold);font-weight:800;font-size:13px}
.hero .v{font-size:15px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat .v{font-size:26px;font-weight:900;line-height:1.2}
.stat .k{font-size:12px;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:14px;background:var(--gold);color:#16233F;font-weight:900;font-size:16px}
.btn.alt{background:var(--surface);color:var(--fg);border:1px solid var(--line);font-weight:700}
.btn.dark{background:var(--brand);color:var(--brandfg)}
.btn:disabled{opacity:.5}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;text-align:start}
.row .ix{width:40px;height:40px;flex:none;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-weight:900}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:800;line-height:1.45}
.row .tx span{font-size:13px;color:var(--muted)}
.row .lock{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--good);border-radius:6px}
.unit{font-size:13px;font-weight:800;color:var(--muted);margin:18px 2px 8px;letter-spacing:.01em}
.weights{display:flex;flex-direction:column;gap:8px}
.wrow{display:grid;grid-template-columns:7.5em 1fr 2.2em;gap:10px;align-items:center;font-size:13px}
.wrow .wb{height:14px;border-radius:7px;background:var(--surface2);overflow:hidden}
.wrow .wb i{display:block;height:100%;background:var(--gold);border-radius:7px}
.wrow .wn{text-align:left;font-weight:800}
/* question */
.qhead{display:flex;align-items:center;gap:8px;margin:16px 0 8px;flex-wrap:wrap}
.tag{font-size:12px;border-radius:999px;padding:2px 10px;background:var(--surface2);color:var(--muted);font-weight:700}
.tag.g{background:var(--goldsoft);color:var(--fg)}
.qtext{font-size:18px;font-weight:700;line-height:1.85;margin:0 0 12px}
.qimg{display:block;max-width:100%;max-height:300px;margin:0 auto 12px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;line-height:1.7}
.opt .L{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-weight:900;font-size:14px;direction:ltr}
.opt .ot{flex:1;min-width:0}
.opt.sel{border-color:var(--brand)}
.opt.ok{border-color:var(--good);background:var(--goodsoft)}
.opt.ok .L{background:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--badsoft)}
.opt.no .L{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.tblwrap{overflow-x:auto;margin-bottom:10px;border-radius:12px;border:1px solid var(--line)}
table.qt{border-collapse:collapse;width:100%;table-layout:fixed;font-size:14px;background:var(--surface)}
table.qt th,table.qt td{border:1px solid var(--line);padding:8px;text-align:center;vertical-align:middle}
table.qt th{background:var(--surface2);font-weight:800}
table.qt td.L,table.qt th.L{font-weight:900;direction:ltr;width:36px}
table.qt.wide{min-width:560px}
table.qt tr.ok td{background:var(--goodsoft)}
table.qt tr.no td{background:var(--badsoft)}
table.qt tr.pick{cursor:pointer}
.tsel{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tsel .opt{justify-content:center;padding:10px}
.expl{margin-top:14px;border-radius:14px;padding:14px 16px;border:1px solid var(--line);background:var(--surface)}
.expl.ok{border-color:var(--good)}
.expl.no{border-color:var(--bad)}
.expl b.v{display:block;font-weight:900;margin-bottom:4px}
.expl.ok b.v{color:var(--good)}
.expl.no b.v{color:var(--bad)}
.ref{margin-top:10px;font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.qnav{display:flex;gap:10px;margin-top:16px}
.qnav .btn{flex:1}
.prog{height:6px;background:var(--surface2);border-radius:6px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--gold)}
.timer{font-weight:900;font-size:15px;direction:ltr}
.timer.low{color:var(--bad)}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:12px}
.dots button{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;padding:0}
.dots button.done{background:var(--brand);color:var(--brandfg);border-color:var(--brand)}
.dots button.cur{outline:2px solid var(--gold)}
.dots button.ok{background:var(--good);color:#fff;border-color:var(--good)}
.dots button.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.score{text-align:center;padding:22px 16px}
.score .big{font-size:56px;font-weight:900;line-height:1}
.score .of{color:var(--muted)}
.ped{display:flex;gap:10px;flex-wrap:wrap}
.ped svg{background:#fff;border-radius:8px;max-width:100%}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:9px 2px 11px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;font-weight:700}
nav.tabs svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--fg)}
nav.tabs button[aria-current="page"] svg{color:var(--gold)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:14px}
select,input[type=number],input[type=date]{width:100%;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit}
.chk{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--brand);flex:none}
.chk .tx{flex:1;min-width:0}
.chk .tx>span{display:block;font-size:12px;color:var(--muted)}
.yr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.yr:last-child{border-bottom:0}
.yr b{flex:1;white-space:nowrap}
.yr span{text-align:start}
.big2{font-size:34px;font-weight:900;line-height:1.1}
.rep{background:var(--goldsoft);color:var(--fg)}
.lb{display:flex;flex-direction:column;gap:8px}
.lbr{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 12px}
.lbr.me{border-color:var(--gold);background:var(--goldsoft)}
.lbr .rk{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:var(--surface2);font-size:14px}
.lbr .rk.r1{background:#FFC928;color:#16233F}.lbr .rk.r2{background:#C9D3E6;color:#16233F}.lbr .rk.r3{background:#D89B5E;color:#16233F}
.lbr .nm{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbr .nm small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.lbr .n{font-weight:900;font-size:18px;text-align:left}
.lbr .n small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.youtag{font-size:11px;background:var(--gold);color:#16233F;border-radius:6px;padding:0 6px;margin-inline-start:6px}
.demo{background:var(--goldsoft);border:1px dashed var(--gold);border-radius:12px;padding:8px 12px;font-size:13px}
textarea{width:100%;min-height:90px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;resize:vertical}
.aians{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;white-space:pre-wrap;line-height:1.85}
.aibtn{margin-top:10px;width:100%;border:2px solid var(--brand);background:var(--surface);color:var(--fg);border-radius:12px;padding:10px;font-weight:800}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(5,10,25,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--bg);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
input[type=text]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.err{color:var(--bad);font-size:14px;min-height:1.2em}
.toast{white-space:nowrap;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--brand);color:var(--brandfg);font-weight:800;border-radius:999px;padding:8px 20px;z-index:30}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.seg{display:flex;background:var(--surface2);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:8px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
@media (max-width:380px){.qtext{font-size:17px}.hero{grid-template-columns:1fr}.hero .ring{margin:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.acc{background:var(--surface2);border:0;border-radius:12px;padding:8px 12px;color:inherit;font-weight:800;font-size:13px;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero2{margin-top:16px;background:var(--brand);color:var(--brandfg);border-radius:20px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.hero2 .ring{width:96px;height:96px}
.hero2 .cd{font-size:40px;font-weight:900;line-height:1;color:var(--gold)}
.hero2 .k{font-size:13px;font-weight:700;opacity:.85}
.hero2 .v{font-size:15px;margin-top:4px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.rv{border:2px solid var(--gold);background:var(--goldsoft)}
.rv .big2{color:var(--fg)}
.weak{display:flex;flex-direction:column;gap:8px}
.wk{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;width:100%;text-align:start}
.wk b{font-weight:800;font-size:15px;line-height:1.45}
.wk .p{font-weight:900;font-size:18px}
.wk small{grid-column:1/-1;color:var(--muted);font-size:12px}
.wk .wb{grid-column:1/-1;height:8px;border-radius:6px;background:var(--surface2);overflow:hidden}
.wk .wb i{display:block;height:100%;border-radius:6px}
.lo{color:var(--bad)}.mid{color:var(--gold)}.hi{color:var(--good)}
.note{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:13px}
.wait{opacity:.6;pointer-events:none}
.imgph{display:grid;place-items:center;height:120px;margin:0 auto 12px;border-radius:12px;border:1px dashed var(--line);color:var(--muted);font-size:13px}
input[type=password]{width:100%;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit}
.copy{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.copy b{flex:1;direction:ltr;text-align:left;font-size:18px}
.copy button{border:0;background:var(--brand);color:var(--brandfg);border-radius:10px;padding:6px 12px;font-weight:800}
.boot{min-height:70vh;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.dueinfo{font-size:12px;color:var(--muted)}
.freq{display:flex;flex-direction:column;gap:8px}
.frow{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;text-align:start}
.frow .fr{width:28px;height:28px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:900;font-size:13px}
.frow:nth-child(1) .fr{background:#FFC928;color:#16233F}.frow:nth-child(2) .fr{background:#C9D3E6;color:#16233F}.frow:nth-child(3) .fr{background:#D89B5E;color:#16233F}
.frow .fn{min-width:0;display:flex;flex-direction:column;gap:4px}
.frow .fn b{font-weight:800;font-size:14px;line-height:1.5}
.frow .fn small{font-size:12px;color:var(--muted)}
.frow .wb{height:8px;border-radius:6px;background:var(--surface2);overflow:hidden}
.frow .wb i{display:block;height:100%;background:var(--gold);border-radius:6px}
.frow .fv{font-weight:900;font-size:20px}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:140px}
.d7{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.d7 i{display:block;width:70%;background:var(--gold);border-radius:6px 6px 2px 2px}
.d7 span{font-size:12px;font-weight:800}
.d7 small{font-size:10px;color:var(--muted);white-space:nowrap}
.inst{border:2px dashed var(--gold);background:var(--goldsoft)}
.inst .x,.ldel{border:0;background:none;color:var(--muted);font-size:16px;padding:2px 6px}
details.lday{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
details.lday[open]{border-color:var(--gold)}
details.lday summary{display:flex;gap:10px;align-items:center;cursor:pointer;list-style:none;font-weight:800}
details.lday summary::-webkit-details-marker{display:none}
details.lday summary::before{content:'‹';color:var(--muted);font-size:18px;transition:transform .2s}
details.lday[open] summary::before{transform:rotate(-90deg)}
.lday .ld{flex:1}
.lday .lm{font-size:12px;color:var(--muted);font-weight:700}
.lit{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.lit:first-of-type{margin-top:8px}
.lit .lt{flex:1;min-width:0;white-space:pre-wrap;line-height:1.7}
.lit.dn .lt{text-decoration:line-through;color:var(--muted)}
.lck{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--good);background:var(--surface);color:#fff;font-weight:900;display:grid;place-items:center;padding:0}
.lit.dn .lck{background:var(--good)}
.fb{border-inline-start:4px solid var(--bad)}
.pending .opt.sel{border-color:var(--gold);position:relative}
.pending .opt.sel::after{content:'';position:absolute;inset-inline-end:14px;top:50%;width:18px;height:18px;margin-top:-9px;border:3px solid var(--gold);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.pending .opt:not(.sel){opacity:.7}
@keyframes spin{to{transform:rotate(360deg)}}
nav.tabs button{position:relative;font-size:11px;line-height:1.25;padding:8px 1px 10px}
nav.tabs button span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-inline:2px}
nav.tabs .nb{position:absolute;top:4px;inset-inline-start:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:999px;font-size:10px;min-width:17px;height:17px;line-height:17px;padding:0 4px}
.tiles{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.tile{display:grid;grid-template-columns:52px 1fr;grid-template-rows:auto auto auto;column-gap:14px;row-gap:2px;align-items:center;text-align:start;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;border-inline-start:6px solid var(--gold)}
.tile .ti{grid-row:1/4;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--goldsoft);color:var(--fg)}
.tile .ti svg{width:28px;height:28px}
.tile b{font-size:19px;font-weight:900}
.tile span{font-size:13px;color:var(--muted)}
.tile small{font-size:13px;font-weight:700;color:var(--fg)}
.tile.t2{border-inline-start-color:var(--good)}.tile.t2 .ti{background:var(--goodsoft)}
.tile.t3{border-inline-start-color:#6C7BD9}.tile.t3 .ti{background:rgba(108,123,217,.16)}
.dnav{display:grid;grid-template-columns:44px 1fr 44px;gap:10px;align-items:center;margin-top:16px;text-align:center}
.dnav button{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px}
.dnav button:disabled{opacity:.35}
.dnav b{display:block;font-size:20px;font-weight:900}
.dnav small{color:var(--muted);font-size:13px}
.kindbtn{display:flex;flex-direction:column;gap:4px;text-align:start;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px}
.kindbtn b{font-weight:900}.kindbtn span{font-size:12px;color:var(--muted)}
.phead{display:grid;grid-template-columns:84px 1fr 70px;gap:8px;margin:16px 4px 6px;font-size:12px;font-weight:800;color:var(--muted)}
.phead span:last-child{text-align:center}
.prows{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:84px 1fr 70px;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
.prow.st{border-inline-start:4px solid var(--gold)}
.prow.done{background:var(--goodsoft);border-color:var(--good)}
.prow.done .plabel,.prow.done .pnote{text-decoration:line-through;color:var(--muted)}
.ptime{width:100%;min-width:0;background:var(--surface2);color:var(--fg);border:0;border-radius:10px;padding:8px 4px;font:inherit;font-size:14px;direction:ltr;text-align:center}
.pbody{min-width:0;display:flex;flex-direction:column;gap:6px}
.pst{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pst select{padding:7px 6px;font-size:13px;border-radius:10px}
.plabel,.pnote{width:100%;min-width:0;background:transparent;color:var(--fg);border:0;border-bottom:1px dashed var(--line);padding:6px 2px;font:inherit;font-size:14px}
.plabel{font-weight:700}
.pact{display:flex;gap:4px;align-items:center;justify-content:center}
.pdone{width:34px;height:34px;border-radius:50%;border:2px solid var(--good);background:var(--surface);color:#fff;font-weight:900;padding:0}
.prow.done .pdone{background:var(--good)}
.pdel{border:0;background:none;color:var(--muted);font-size:15px;padding:4px}
.addrow{margin-top:10px}.addrow .btn{padding:11px 6px;font-size:14px}
.quote{margin-top:16px;text-align:center;border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--surface)}
.quote b{display:block;color:var(--gold);font-weight:900}
.quote .ar{font-family:'Amiri','Traditional Arabic',serif;font-size:20px;margin:6px 0}
.quote span{font-size:13px;color:var(--muted)}
.fri{margin-top:16px;border-radius:16px;padding:14px 16px;background:var(--surface2);display:flex;flex-direction:column;gap:4px}
.fri.on{background:var(--goodsoft);border:2px solid var(--good)}
.fri b{font-weight:900}.fri span{font-size:14px}
.wsub{margin-bottom:14px}
.wsh{font-weight:900;margin:0 4px 8px;display:flex;gap:8px;align-items:center}
.wsh span{background:var(--surface2);border-radius:999px;padding:0 8px;font-size:12px}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.wtop{display:flex;gap:10px;align-items:center}.wtop b{flex:1;font-size:16px}
.wn2{background:var(--goldsoft);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800}
.wdates{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;color:var(--muted)}
.wdates b{color:var(--fg)}
.wtbl{min-width:520px}.wtbl td,.wtbl th{font-size:13px}
/* schedule rows: study rows use two lines so the choices are readable on phones */
.prow{grid-template-columns:78px 1fr 64px;grid-template-areas:"time body act"}
.prow .ptime{grid-area:time}.prow .pbody{grid-area:body}.prow .pact{grid-area:act}
.prow.st{grid-template-columns:78px 1fr 64px;grid-template-areas:"time kind act" "body body body"}
.prow.st .pst{grid-area:kind;display:block}
.prow.st .pst select{width:100%}
.prow.st .pbody{grid-area:body}
.pst2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pst2 select{padding:8px 6px;font-size:14px;border-radius:10px}
.phead{grid-template-columns:78px 1fr 64px}
.wtbl{min-width:0;table-layout:auto}.wtbl td,.wtbl th{font-size:12px;padding:6px 4px}
.hlogo{width:40px;height:40px;border-radius:11px;flex:none}
.decks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.deck{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-height:84px}
.deck b{font-size:17px;font-weight:900}
.deck small{font-size:12px;color:var(--muted)}
.deck .dc{position:absolute;top:12px;inset-inline-end:12px;min-width:30px;height:30px;border-radius:999px;display:grid;place-items:center;background:var(--surface2);font-weight:900;font-size:15px;padding:0 8px}
.deck.has{border-color:var(--gold);border-width:2px}
.deck.has .dc{background:var(--gold);color:#16233F}

/* light-theme polish */
.row,.wk,.frow,.tile,.deck,.wcard,.prow,.stat,.lbr,details.lday,.opt{box-shadow:var(--shadow)}
.hero2{background:linear-gradient(135deg,#14284F,#1F3A6E)}
.btn{box-shadow:0 2px 6px rgba(212,155,30,.25)}.btn.alt{box-shadow:var(--shadow)}.btn.dark{box-shadow:0 2px 8px rgba(20,40,79,.25)}
nav.tabs{background:rgba(255,255,255,.97);box-shadow:0 -2px 12px rgba(20,33,61,.06)}
nav.tabs button[aria-current="page"]{color:var(--brand)}
.linkbtn{background:none;border:0;color:var(--brand);font-weight:800;text-decoration:underline;padding:6px;font-size:14px}
.wtc{border:2px solid var(--brand)}
.subbar{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 0;padding:2px 16px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.subbar::-webkit-scrollbar{display:none}
.subbar button{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;font:inherit;font-weight:800;font-size:14px;cursor:pointer}
.subbar button small{font-weight:700;color:var(--muted);font-size:12px}
.subbar button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.subbar button[aria-pressed="true"] small{color:rgba(255,255,255,.75)}
.qtext[dir="ltr"],.ot[dir="ltr"]{text-align:left}
.lr{direction:ltr;unicode-bidi:isolate;display:inline;white-space:nowrap}.lr.lw{white-space:normal}
.qimg{cursor:zoom-in}
.zoomov{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.88);overflow:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:flex-start;justify-content:center;padding:48px 8px 24px}
.zoomov img{width:100%;max-width:none;height:auto;background:#fff;border-radius:8px}
.zoomov .zx{position:fixed;top:8px;left:8px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;font-size:22px;font-weight:900}
.xstats{padding:4px 14px}
.xrow{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.xrow:last-child{border-bottom:0}
.xv{min-width:3.6em;text-align:center;font-size:24px;font-weight:900;color:var(--brand);flex:none}
.xv.hi{color:var(--good)}.xv.mid{color:var(--gold)}.xv.lo{color:var(--bad)}
.xt{flex:1;min-width:0}.xt b{display:block;font-size:15px}.xt small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.5}
.psg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 12px}
.psg summary{cursor:pointer;font-weight:800;font-size:14px;color:var(--brand)}
.psg div{margin-top:8px;font-size:15.5px;line-height:1.75;text-align:left;font-family:Georgia,serif}
.expl .et{line-height:1.9}
.et .el{margin:2px 0}
.et.st .el{padding:3px 0}
.et .el.ea{padding-right:14px}
.et .arr{color:var(--brand);font-weight:900}
.opt.hasp{position:relative;background-image:linear-gradient(to left,rgba(20,40,79,.07) var(--p),transparent var(--p))}
.opt.hasp.ok{background-image:linear-gradient(to left,rgba(29,138,90,.16) var(--p),transparent var(--p))}
.opt.hasp.no{background-image:linear-gradient(to left,rgba(194,65,58,.14) var(--p),transparent var(--p))}
.opt .pc{margin-inline-start:auto;font-size:14px;font-weight:900;color:var(--muted);flex:none;padding-inline-start:8px}
.opt.ok .pc{color:var(--good)}.opt.no .pc{color:var(--bad)}
.pcnote{font-size:12px;margin:-4px 2px 8px}
.qnav.g3{grid-template-columns:1fr 56px 1fr;display:grid;gap:10px}
.qnav .gbtn{padding-inline:0;font-weight:900;letter-spacing:-1px}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sg{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 4px 8px;min-width:0;box-shadow:var(--shadow)}
.sg .sgi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;line-height:1}
.sg b{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sg small{font-size:11px;color:var(--muted)}
.sg .sgb{display:block;width:80%;height:4px;border-radius:4px;background:var(--surface2);overflow:hidden}
.sg .sgb i{display:block;height:100%;background:var(--good)}
.voices{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.voice{flex:0 0 85%;scroll-snap-align:start;background:var(--brand);color:#fff;border-radius:16px;padding:14px 16px}
.voice p{margin:0;font-size:15px;line-height:1.8}
.voice small{display:block;margin-top:6px;color:var(--gold);font-weight:800}
html[data-theme=dark]{--bg:#0E1422;--surface:#172031;--surface2:#212B3D;--line:#2B3649;--fg:#E7EBF3;--muted:#9AA5B8;--brand:#3D5FA8;--brandfg:#FFFFFF;--goldsoft:#3B3016;--goodsoft:#123222;--badsoft:#3B1D1B;--good:#3DBB7F;--bad:#EA6B62;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
html[data-theme=dark] header.top{background:rgba(14,20,34,.96)}
html[data-theme=dark] nav.tabs{background:rgba(23,32,49,.97)}
html[data-theme=dark] .qimg,html[data-theme=dark] .psg div{background:#fff;color:#14213D}
html[data-theme=dark] .psg div{padding:8px;border-radius:8px}
html[data-theme=dark] .sg .sgi{filter:saturate(.8) brightness(.85)}
.thm{display:block;margin:18px auto 0;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:14px;color:var(--muted)}
.mcard{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 12px;text-align:center}
.mcard .mav{width:72px;height:72px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:900;border:4px solid var(--goldsoft)}
.mcard b{font-size:20px}
.mh{font-size:13px;font-weight:800;color:var(--muted);margin:10px 4px -4px}
.mgrp{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:14px;background:none;border:0;border-bottom:1px solid var(--line);text-align:start;color:var(--fg);text-decoration:none;font:inherit;cursor:pointer;list-style:none}
.mrow::-webkit-details-marker{display:none}
.mgrp>:last-child,.mgrp>:last-child>.mrow{border-bottom:0}
.mdet[open] .mrow{border-bottom:1px solid var(--line)}
.mrow .mi{width:28px;text-align:center;font-size:18px}
.mrow .mt{flex:1;font-weight:700}
.mrow .mv{color:var(--muted);font-size:14px}
.mrow .mc{color:var(--brand);font-size:22px;line-height:1}
.mrow.bad .mt,.mrow.bad .mi{color:var(--bad)}
.mtx{margin:0;padding:10px 16px 14px;font-size:14px;color:var(--muted);line-height:1.9}
.mgrp,.mcard,.mh{flex-shrink:0}
.sheet .box>*{flex-shrink:0}
/* ---------- flashcards ---------- */
.tile.t4{border-inline-start-color:#E0456B}.tile.t4 .ti{background:rgba(224,69,107,.14);color:#C2305A}
.fsub{display:flex;gap:8px;overflow-x:auto;margin-top:14px;padding-bottom:4px;scrollbar-width:none}
.fsub button{flex:0 0 auto;display:flex;gap:6px;align-items:center;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:14px;color:var(--fg)}
.fsub button[aria-pressed=true]{background:var(--brand);color:var(--brandfg);border-color:var(--brand)}
.fchero{margin-top:14px;display:flex;flex-direction:column;gap:14px}
.fch1{display:flex;gap:14px;align-items:center}.fch1 .ring{width:92px;height:92px;flex:0 0 auto;color:var(--fg)}
.fch1 .ring circle:first-child{stroke:var(--line)}
.okmsg{background:var(--goodsoft);color:var(--good);border-radius:12px;padding:12px;font-weight:800;text-align:center}
.deckrow .lock{margin-inline-start:auto}
.fcwrap{display:flex;flex-direction:column}
.fcnt{display:flex;gap:8px;justify-content:center;margin:12px 0 4px}
.fscene{perspective:1200px;margin-top:10px}
.fcard{position:relative;display:block;width:100%;min-height:340px;border:0;padding:0;background:none;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.3,1);cursor:pointer;text-align:center}
.fcard.on{transform:rotateY(180deg)}
.fface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:26px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;box-shadow:0 10px 28px rgba(20,33,61,.14);overflow:auto}
.fface.front{background:linear-gradient(140deg,#EE3D63,#8E1E52);color:#fff}
.fface.back{background:var(--surface);color:var(--fg);border:2px solid var(--line);transform:rotateY(180deg)}
.fcs{position:absolute;top:14px;inset-inline:16px;font-size:12px;font-weight:700;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fct{font-size:clamp(22px,6vw,30px);font-weight:900;line-height:1.5}
.fcb{font-size:17px;line-height:1.95;font-weight:600}
.fhint{position:absolute;bottom:14px;font-size:12px;opacity:.75}
.fimg{max-width:100%;max-height:150px;border-radius:12px;background:#fff}
.fcbtns{margin-top:16px}
.fno{background:var(--bad)!important;color:#fff!important}.fyes{background:var(--good)!important;color:#fff!important}
.fen{display:block;font-size:16px;font-weight:700;opacity:.85;margin-top:10px;font-family:system-ui,sans-serif}
.fpg{display:block;font-size:12px;color:var(--muted);margin-top:12px;font-weight:700}
</style>

// Tiny Supabase client (REST + Auth over plain fetch). Replaces supabase-js, whose auth lock
// could hang on some Android browsers. Every request has a time limit, so nothing waits forever.
function SBC(url,key,opt){
  const SK=(opt&&opt.storageKey)||'sb-auth';

    from,
    async rpc(fn,args){return req('/rest/v1/rpc/'+fn,{method:'POST',headers:await H(),body:JSON.stringify(args||{})})},

const DF=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Baghdad',year:'numeric',month:'2-digit',day:'2-digit'});
function todayStr(){return DF.format(new Date())}
function addDays(s,n){const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function dayDiff(a,b){return Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5)}
function fmtD(s){const p=s.split('-');return +p[2]+'/'+(+p[1])+'/'+p[0]}

function srcLabel(q){const e=EX[q.ex];return 'وەزاری '+e.year+' · '+e.round+' · پرسیاری '+q.n}
function done_(id){const p=ST.prog[id];return !!(p&&(p.c+p.w)>0)}
function statsFor(list){let seen=0,ok=0;list.forEach(q=>{const p=ST.prog[q.id];if(p&&(p.c+p.w)>0){seen++;if(p.last)ok++}});return {n:list.length,seen,ok,pct:seen?Math.round(ok/seen*100):0}}
function inReview(id){const p=ST.prog[id];return !!(p&&p.box>=1)}
function inCur(id){const q=BYID[id];return !!(q&&q.sub===CUR)}
function dueIds(){const t=todayStr();return Object.keys(ST.prog).filter(id=>inCur(id)&&inReview(id)&&ST.prog[id].due&&ST.prog[id].due<=t)}
function reviewIds(){return Object.keys(ST.prog).filter(id=>inCur(id)&&inReview(id))}
function pgOf(k){return SEC[k]&&SEC[k][1]?SEC[k][1]:0}
function pgTxt(k){return pgOf(k)?' · کتێب لاپەڕە <span class="num ltr">'+pgOf(k)+'–'+secEnd(k)+'</span>':''}
function streak(){let d=todayStr(),n=0;if(!ST.days[d])d=addDays(d,-1);while(ST.days[d]){n++;d=addDays(d,-1)}return n}

// same rules as _record() in the database: wrong -> box 1 (+1 day); right when due -> box 2 (+3), box 3 (+7), then learned
function recLocal(id,ok){const t=todayStr();ST.days[t]=(ST.days[t]||0)+1;let p=ST.prog[id];
  if(!p){p=ST.prog[id]={c:0,w:0,box:ok?0:1,due:ok?null:addDays(t,1)}}
  else if(!ok){p.box=1;p.due=addDays(t,1)}
  else if(p.box>=1&&p.box<=3&&(!p.due||p.due<=t)){p.box++;p.due=p.box===2?addDays(t,3):p.box===3?addDays(t,7):null;if(p.box>=4)p.box=0}
  ok?p.c++:p.w++;p.last=ok?1:0;boardSoon()}

const CK='bio_cache_v3';
function applyBase(exams,index){ALLEX=exams.map(e=>Object.assign({sub:'bio'},e));EX={};ALLEX.forEach(e=>{e.year='⁦'+e.year+'⁩';EX[e.id]=e});
  const old=BYID;ALLQS=index.map(r=>{const o=old[r[0]],q={id:r[0],ex:r[1],n:r[2],s:r[3],sub:r[5]||'bio'};if(o&&o.full){Object.keys(o).forEach(k=>{if(!(k in q))q[k]=o[k]})}return q});BYID={};ALLQS.forEach(q=>BYID[q.id]=q);setSub(CUR,1)}
function applyBodies(rows){rows.forEach(x=>{const q=BYID[x.id];if(q){Object.assign(q,x.body);q.full=1}})}
const DEF_PICK=()=>({mode:'sec',c:+Object.keys(CH)[0]||1,secs:[],from:SEC[SECK[0]]?SEC[SECK[0]][1]||1:1,to:SEC[SECK[1]]?SEC[SECK[1]][1]||10:10});
function savePick(){save(CUR==='bio'?'bio_pick':'bio_pick_'+CUR,ST.pick)}
function setSub(s,quiet){if(!SUBJ_META[s])s='bio';const ch=s!==CUR;CUR=s;save('bio_sub',s);const M=SUBJ_META[s];CH=M.CH;SEC=M.SEC;UNIT=M.UNIT;SECK=Object.keys(SEC);LAST=M.last||300;
  EXAMS=ALLEX.filter(e=>e.sub===s);YEARS=[...new Set(EXAMS.map(e=>e.year))];QS=ALLQS.filter(q=>q.sub===s);
  if(!ST.pick||ch||ST.pick._s!==s){ST.pick=Object.assign(DEF_PICK(),load(s==='bio'?'bio_pick':'bio_pick_'+s,null)||{},{_s:s});if(!CH[ST.pick.c])ST.pick.c=+Object.keys(CH)[0]}
  if(!quiet&&sb){if(!ST.bodyOk[s])ST.bodiesP=loadBodies(s).then(()=>render()).catch(()=>{});if(ST.user)loadWt().then(()=>render()).catch(()=>{});ST.wtb=null;ST.mtb=null}}
function subCount(s){return ALLQS.filter(q=>q.sub===s).length}
function subBar(){const L=SUBS.filter(s=>s===CUR||subCount(s));if(L.length<2)return '';
  return '<div class="subbar" role="tablist">'+L.map(s=>'<button data-sub="'+s+'" aria-pressed="'+(s===CUR)+'">'+esc(subName(s))+'<small class="num">'+subCount(s)+'</small></button>').join('')+'</div>'}
let BASE=null;
function meKey(){return ST.user?'bio_me_'+ST.user.id:null}
function saveMe(){const k=meKey();if(!k||!ST.prof)return;try{localStorage.setItem(k,JSON.stringify({prof:ST.prof,prog:ST.prog,days:ST.days,best:ST.best,plans:ST.plans,wr:ST.wr}))}catch(e){}}
function applyMe(M){ST.prof=M.prof;ST.prog=M.prog||{};ST.days=M.days||{};ST.best=M.best||{};ST.plans=M.plans||{};ST.wr=M.wr||[];ST.planOk=true;ST.wrOk=true}
async function boot(){
  sb=SBC(SB_URL,SB_KEY,{storageKey:'bio12-auth'});
  const C=load(CK,null),S=load('bio12-auth',null);
  if(C&&C.exams&&C.index){try{applyBase(C.exams,C.index);cachedBodies();ST.user=S&&S.user?S.user:null;const M=ST.user?load(meKey(),null):null;if(M)applyMe(M);ST.ready=true;render()}catch(e){console.error(e)}}
  if(!C){const O=load('bio_cache_v2',null);if(O&&O.bodies)try{localStorage.setItem('bio_bodies_bio',JSON.stringify(O.bodies));localStorage.removeItem('bio_cache_v2')}catch(e){}}
  try{
    let [r,ex,ix]=await Promise.all([sb.auth.getSession(),sb.from('exams').select('id,year,round,ord,sub').order('ord'),sb.rpc('q_index')]);
    if(ex.error&&/sub/.test(ex.error.message||''))ex=await sb.from('exams').select('id,year,round,ord').order('ord');
    if(ex.error||ix.error)throw ex.error||ix.error;
    ST.user=r.data&&r.data.session?r.data.session.user:null;
    BASE={exams:ex.data,index:ix.data};applyBase(ex.data,ix.data);cachedBodies();try{localStorage.setItem(CK,JSON.stringify(BASE))}catch(e){}
    await loadMe();
    ST.ready=true;ST.err=null;render();loadBoard();loadStats();fcInit();
  }catch(e){console.error(e);if(!ST.ready){ST.err='net';render()}}
}
async function loadMe(){
  const bodies=loadBodies(CUR).then(()=>{if(!V.lock&&!V.acc&&!V.aiq)render()}).catch(()=>{});
  if(ST.user){
    const uid=ST.user.id;
    const [p,g,d,s]=await Promise.all([
      sb.from('profiles').select('*').eq('id',uid).maybeSingle(),
      allRows(()=>sb.from('progress').select('qid,right_n,wrong_n,last,box,due').eq('user_id',uid)),
      sb.from('study_days').select('day,n').eq('user_id',uid).order('day',{ascending:false}).range(0,399),
      sb.from('exam_scores').select('ex,best').eq('user_id',uid)]);
    if(p.error)throw p.error;
    ST.prof=p.data;ST.prog={};ST.days={};ST.best={};
    (g.data||[]).forEach(r=>ST.prog[r.qid]={c:r.right_n,w:r.wrong_n,last:r.last?1:0,box:r.box,due:r.due});
    (d.data||[]).forEach(r=>ST.days[r.day]=r.n);
    (s.data||[]).forEach(r=>ST.best[r.ex]=r.best);
    loadWt().then(()=>{if(!RUN&&V.sec==='bank')render()}).catch(()=>{});
    loadPlanner().then(()=>{saveMe();if(!RUN&&V.sec!=='bank')render()});
  }else{ST.prof=null;ST.prog={};ST.days={};ST.best={};ST.log=[];ST.plans={};ST.wr=[]}
  ST.bodiesP=bodies;
}
async function allRows(mk){let out=[],i=0;for(;;){const r=await mk().range(i,i+999);if(r.error)return r;out=out.concat(r.data||[]);if(!r.data||r.data.length<1000)break;i+=1000}return {data:out,error:null}}
function cachedBodies(){SUBS.forEach(s=>{const b=load('bio_bodies_'+s,null);if(b)applyBodies(b)})}
async function loadBodies(s){s=s||CUR;
  let r=await allRows(()=>sb.from('questions').select('id,body').eq('sub',s));
  if(r.error&&s==='bio')r=await allRows(()=>sb.from('questions').select('id,body'));
  if(r.error)throw r.error;
  applyBodies(r.data);ST.bodyOk[s]=1;
  try{localStorage.setItem('bio_bodies_'+s,JSON.stringify(r.data))}catch(e){try{SUBS.forEach(x=>{if(x!==s)localStorage.removeItem('bio_bodies_'+x)});localStorage.setItem('bio_bodies_'+s,JSON.stringify(r.data))}catch(e2){}}
}

function secStats(){const out=[];SECK.forEach(k=>{const L=QS.filter(q=>q.s===k);const s=statsFor(L);if(s.seen)out.push({k,...s})});return out}

function freqData(){const cnt={},sc={},yrs={};QS.forEach(q=>{const c=chOf(q);cnt[c]=(cnt[c]||0)+1;sc[q.s]=(sc[q.s]||0)+1;(yrs[q.s]=yrs[q.s]||new Set()).add(EX[q.ex].year)});
  const ch=Object.keys(cnt).map(c=>({c:+c,n:cnt[c],pct:Math.round(cnt[c]/QS.length*100),per:(cnt[c]/EXAMS.length)})).sort((a,b)=>b.n-a.n);
  const se=Object.keys(sc).map(k=>({k,n:sc[k],y:yrs[k].size})).sort((a,b)=>b.n-a.n);return {ch,se}}

function reportCard(){if(!ST.user)return '';return '<h2>ڕاپۆرت بۆ دایک و باوک</h2><div class="card stack"><span class="muted" style="font-size:14px">کورتەیەکی ڕوون لە خوێندنەکەت: چەندت کردووە، ڕێژەی ڕاستی، ڕۆژەکانی خوێندن و خاڵە لاوازەکان. بە WhatsApp یان Telegram بینێرە.</span><button class="btn alt" data-act="openreport">بینینی ڕاپۆرت</button></div>'}
function last7(){const out=[];for(let i=6;i>=0;i--){const d=addDays(todayStr(),-i);out.push({d,n:ST.days[d]||0})}return out}

function reportData(){const all=statsFor(QS),W=weakList(3),wk=last7(),wsum=wk.reduce((a,x)=>a+x.n,0),active=wk.filter(x=>x.n).length;
  const best=EXAMS.filter(e=>ST.best[e.id]!=null).map(e=>({e,b:ST.best[e.id]}));

function hardLogout(key){const clear=()=>{try{Object.keys(localStorage).forEach(k=>{if(k===key||k.startsWith(key)||k.startsWith('bio_me_')||/^sb-.*-auth-token/.test(k))localStorage.removeItem(k)})}catch(e){}};
  clear();let p;try{p=sb.auth.signOut({scope:'local'})}catch(e){p=Promise.resolve()}
  Promise.race([Promise.resolve(p).catch(()=>{}),new Promise(r=>setTimeout(r,1500))]).then(()=>{clear();location.reload()})}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

async function submitExam(){const R=RUN;if(!R||R.submitted||R.sending)return;R.sending=1;R.sendErr='';render();
  let r=await (R.wt?sb.rpc('weekly_test_submit',{p_ans:R.ans,p_sub:R.sub}):R.mt?sb.rpc('monthly_test_submit',{p_ans:R.ans,p_sub:R.sub}):R.mix?sb.rpc('mixed_test_submit',{p_ids:R.ids,p_ans:R.ans}):sb.rpc('submit_exam',{p_ex:R.exId,p_ans:R.ans})).catch(e=>({error:e}));
  if(R.wt&&r.error&&R.sub==='bio'&&/function|schema/i.test(r.error.message||''))r=await sb.rpc('weekly_test_submit',{p_ans:R.ans}).catch(e=>({error:e}));
  if(R.wt&&!r.error&&R.sub===CUR){ST.wt={wk:wtWeek(),finished:1,score:r.data.score,good:r.data.good};loadWtBoard()}
  if(R.mt&&!r.error&&R.sub===CUR){ST.mt={finished:1,score:r.data.score,good:r.data.good};loadMtBoard()}
  R.sending=0;
  if(r.error){R.sendErr=ERR[errKey(r.error)]+' (وەڵامەکانت پاشەکەوتن، دووبارە «ناردن» دابگرە)';render();return}
  const res=r.data;R.res=res;R.submitted=true;const t=todayStr();
  R.ids.forEach(id=>{const it=res.items[id];if(!it)return;ST.ans[id]={a:it.a,e:it.e};
    if(R.ans[id]!=null)recLocal(id,it.correct);else{const p=ST.prog[id]||(ST.prog[id]={c:0,w:0});p.last=0;p.box=1;p.due=addDays(t,1)}});
  if(R.exId&&(ST.best[R.exId]==null||res.score>ST.best[R.exId]))ST.best[R.exId]=res.score;
  sb.rpc('qstat_get',{p_ids:R.ids}).then(x=>{if(!x.error&&x.data){Object.assign(ST.dist,x.data);if(RUN===R)render()}}).catch(()=>{});
  render();scrollTo(0,0)}
async function answer(q,p){
  if(needLogin('بۆ وەڵامدانەوەی پرسیارەکان و پاشەکەوتکردنی پێشکەوتنت، هەژمارێکی بەخۆڕایی دروست بکە.'))return;
  const R=RUN;R.ans[q.id]=p;R.wait=q.id;render();
  const r=await sb.rpc('submit_answer',{p_qid:q.id,p_choice:p}).catch(e=>({error:e}));
  R.wait=null;
  if(r.error){delete R.ans[q.id];const k=errKey(r.error);toast(ERR[k]);if(k==='locked')V.lock=1;render();return}
  ST.ans[q.id]={a:r.data.a,e:r.data.e};if(r.data.dist)ST.dist[q.id]=r.data.dist;R.done[q.id]=1;recLocal(q.id,r.data.correct);if(RUN===R)render()}

async function doAcc(b){
  const g=id=>{const el=document.getElementById(id);return el?el.value.trim():''},reg=V.accMode!=='login',er=document.getElementById('ace');
  const user=digits(g('acu')).toLowerCase(),pass=document.getElementById('acp').value;
  if(!/^[a-z0-9_.]{3,20}$/.test(user)){er.textContent='ژمارەی مۆبایل بنووسە (وەک 07501234567)، یان ناوێک بە پیتی ئینگلیزی، بێ بۆشایی.';return}
  if(pass.length<6){er.textContent='وشەی نهێنی دەبێت لانیکەم ٦ پیت یان ژمارە بێت.';return}
  const email=emailOf(user);
  b.disabled=true;er.textContent='چاوەڕێ بکە…';
  try{
    if(reg){
      const name=g('acn'),nick=g('ack');
      if(name.length<3){er.textContent='ناوی تەواوت بنووسە.';b.disabled=false;return}
      if(nick.length<2){er.textContent='نازناوێک بنووسە (لانیکەم ٢ پیت).';b.disabled=false;return}
      const f=await sb.rpc('name_free',{p_username:user,p_nick:nick});
      if(f.error)throw f.error;
      if(!f.data.username){er.textContent='ئەم ناوی بەکارهێنەرە گیراوە، یەکێکی تر هەڵبژێرە.';b.disabled=false;return}
      if(!f.data.nick){er.textContent='ئەم نازناوە گیراوە، یەکێکی تر هەڵبژێرە.';b.disabled=false;return}
      const r=await sb.auth.signUp({email,password:pass,options:{data:{username:user,nick,full_name:name}}});
      if(r.error){er.textContent=/registered|exists/i.test(r.error.message)?'ئەم ناوی بەکارهێنەرە گیراوە.':/password/i.test(r.error.message)?'وشەی نهێنی بەهێزتر هەڵبژێرە.':/Database/i.test(r.error.message)?'ئەم نازناوە گیراوە، یەکێکی تر هەڵبژێرە.':'هەڵەیەک ڕوویدا: '+r.error.message;b.disabled=false;return}
      if(!r.data.session){er.textContent='هەژمارەکە دروست کرا بەڵام چوونەژوورەوە سەرنەکەوت. (ڕێکخستنی Confirm email دەبێت کوژابێتەوە)';b.disabled=false;return}
      ST.user=r.data.session.user;
    }else{
      const r=await sb.auth.signInWithPassword({email,password:pass});
      if(r.error){er.textContent='ناوی بەکارهێنەر یان وشەی نهێنی هەڵەیە.';b.disabled=false;return}
      ST.user=r.data.session.user;
    }
    await loadMe();V.acc=0;V.accWhy='';render();loadBoard();toast(reg?'بەخێربێیت '+(ST.prof?ST.prof.nick:''):'بەخێربێیتەوە');
  }catch(e){er.textContent=ERR.net;b.disabled=false}
}

function planRow(x,i){const done=x.d?' done':'';

  else body='<div class="pbody"><input type="text" class="plabel" data-pi="'+i+'" data-f="l" maxlength="80" value="'+esc(x.l||'')+'"></div>';
  return '<div class="prow'+(x.k==='st'?' st':'')+done+'">'+tm+body+'<div class="pact"><button class="pdone" data-act="pdone" data-pi="'+i+'" aria-label="کرا">'+(x.d?'✓':'')+'</button><button class="pdel" data-act="pdel" data-pi="'+i+'" aria-label="سڕینەوە">✕</button></div></div>'}
function quoteCard(){return '<div class="quote"><b>بەردەوامی ڕۆژانە کلیلی سەرکەوتنە</b><p class="ar">«أَحَبُّ الأَعْمَالِ إِلَى اللهِ تَعَالَى أَدْوَمُهَا وَإِنْ قَلَّ»</p><span>خۆشەویستترین کردەوەکان لای خوای گەورە ئەوانەن کە خاوەنەکەی بەردەوام بێت لەسەری، ئەگەرچی کردەوەکە کەمیش بێت.</span></div>'}
function rowText(x){return x.k==='st'?KINDS[+x.kd||0]+' · '+SUBJ[+x.sb||0]+(x.n?' · '+x.n:''):x.l}
function viewDailyHist(){

function viewDailyStats(){

   xr(full,'','ڕۆژ هەموو خشتەکەت تەواو کردووە','ڕۆژی 100%')+
   xr(ps,'','ڕۆژ بەدوای یەکدا خوێندووتە','هەر ڕۆژێک لانیکەم نیوەی خشتەکەت بکەیت دەژمێردرێت، ئەگەر ڕۆژێک بەجێی بهێڵیت لە سفرەوە دەست پێدەکاتەوە')+'</div>';

  h+='<h2>چەند جار هەر دەرسێکت خوێندووە</h2><p class="muted" style="font-size:13px;margin-top:-4px">هەر جارێک لە خشتەکەت دەرسێک نیشانەی ✓ بکەیت، یەک جار دەژمێردرێت.</p><div class="card weights">'+(Object.keys(bySub).length?SUBJ.map((s,j)=>bySub[j]?'<div class="wrow" style="grid-template-columns:6em 1fr 4.5em"><span>'+s+'</span><div class="wb"><i style="width:'+(bySub[j]/mx*100)+'%"></i></div><span class="wn num">'+bySub[j]+' جار</span></div>':'').join(''):'<div class="muted">هێشتا هیچ دەرسێکت لە خشتەکەت تەواو نەکردووە.</div>')+'</div>';
  if(Object.keys(byKind).length)h+='<h2>چۆن خوێندووتە</h2><div class="card xstats">'+KINDS.map((k,j)=>xr((byKind[j]||0)+' جار','',k,'')).join('')+'</div>';
  return h+'</div>'}
function planStreak(){let d=todayStr(),n=0;const ok=x=>{const s=planStat(x);return s&&s.pct>=50};if(!ok(d))d=addDays(d,-1);while(ok(d)){n++;d=addDays(d,-1)}return n}

function nextFri(s){return isWin(s)?winFri(s):friFrom(s)}
function wrDue(){const t=todayStr(),lim=isWin(t)?t:nextFri(t);return ST.wr.filter(x=>x.next<=lim)}
function gapWeeks(n){return Math.max(1,n)}
function wrCard(x,canDo){const t=todayStr(),over=x.next<winFri(t)&&isWin(t);

   (canDo?'<button class="btn" data-act="wdone" data-id="'+x.id+'">✓ پێداچوونەوەم کرد</button><span class="muted" style="font-size:12px">دەبێتە پێداچوونەوەی <span class="num">'+(x.n+1)+'</span> و دوای <span class="num">'+gapWeeks(x.n+1)+'</span> هەفتە دەگەڕێتەوە.</span>':'')+'</div>'}
function bySubject(list){const g={};list.forEach(x=>{(g[x.subject]=g[x.subject]||[]).push(x)});return SUBJ.filter(s=>g[s]).map(s=>[s,g[s]])}
function deckGrid(act,countOf,subOf){return '<div class="decks">'+SUBJ.map((s,j)=>{const c=countOf(s),sub=subOf(s);return '<button class="deck'+(c?' has':'')+'" data-act="'+act+'" data-s="'+j+'"><b>'+s+'</b><span class="dc num">'+c+'</span><small>'+sub+'</small></button>'}).join('')+'</div>'}

   '<button class="btn" data-act="wadd">زیادکردن</button><span class="muted" style="font-size:13px">دەبێتە پێداچوونەوەی ١ و هەینی <b>'+fmtD(addDays(winFri(t),7))+'</b> دەگەڕێتەوە.</span></div>';

  const t=todayStr(),tot=ST.wr.reduce((a,x)=>a+x.n,0);

  h+='<div class="grid3" style="margin-top:16px"><div class="stat"><div class="v num">'+ST.wr.length+'</div><div class="k">بابەت</div></div><div class="stat"><div class="v num">'+tot+'</div><div class="k">پێداچوونەوەی کراو</div></div><div class="stat"><div class="v num">'+ST.wr.filter(x=>x.n>=3).length+'</div><div class="k">٣ جار یان زیاتر</div></div></div>';
  h+='<h2>٤ هەینی داهاتوو</h2><div class="card stack">';let f=isFri(t)?t:friFrom(t);
  for(let i=0;i<4;i++){const n=ST.wr.filter(x=>i===0?x.next<=f:x.next===f).length;h+='<div class="yr"><b>'+fmtD(f)+'</b><span class="muted"><span class="num">'+n+'</span> بابەت</span></div>';f=addDays(f,7)}
  h+='</div><h2>بەپێی دەرس</h2><div class="card weights">'+(ST.wr.length?bySubject(ST.wr).map(([s,L])=>'<div class="wrow" style="grid-template-columns:6em 1fr 2.4em"><span>'+s+'</span><div class="wb"><i style="width:'+(L.length/ST.wr.length*100)+'%"></i></div><span class="wn num">'+L.length+'</span></div>').join(''):'<div class="muted">هیچ</div>')+'</div>';
  return h+'</div>'}

// ---------- events for planner ----------
function plannerClick(a,b){
  const t=todayStr(),day=curDay();
  if(a==='dprev'||a==='dnext'){V.dday=addDays(day,a==='dprev'?-1:1);render();return true}
  if(a==='dtpl'){const k=b.dataset.k;ST.plans[day]={day,kind:k==='school'?'school':'home',goal:'',items:k==='empty'?[mkRow(['st',0])]:TPL[k].map(mkRow)};savePlanSoon(day);render();return true}
  if(a==='dcopy'){const F=ST.plans[b.dataset.from];ST.plans[day]={day,kind:F.kind,goal:'',items:F.items.map(x=>Object.assign({},x,{d:0}))};savePlanSoon(day);render();return true}
  if(a==='dreset'){if(!b.dataset.sure){b.dataset.sure=1;b.textContent='دڵنیایت؟ خشتەی ئەم ڕۆژە دەسڕێتەوە';return true}delete ST.plans[day];sb.from('daily_plan').delete().eq('user_id',ST.user.id).eq('day',day).then(()=>{});render();return true}
  if(a==='pdone'){const P=ST.plans[day],x=P.items[+b.dataset.pi];x.d=x.d?0:1;savePlanSoon(day);render();return true}
  if(a==='pdel'&&b.dataset.pi!=null){const P=ST.plans[day];P.items.splice(+b.dataset.pi,1);savePlanSoon(day);render();return true}
  if(a==='dadd'){const P=ST.plans[day],k=b.dataset.k;P.items.push(k==='st'?mkRow(['st',0]):k==='br'?mkRow(['fx','پشووی کورت']):mkRow(['fx','']));savePlanSoon(day);render();
    setTimeout(()=>{const r=document.querySelectorAll('.prow');if(r.length)r[r.length-1].scrollIntoView({block:'center'})},30);return true}
  if(a==='dopen'){V.dday=b.dataset.day;V.dtab='plan';render();scrollTo(0,0);return true}
  if(a==='wdeck'){V.wdeck=+b.dataset.s;render();scrollTo(0,0);return true}
  if(a==='wadeck'){V.wadeck=+b.dataset.s;render();scrollTo(0,0);return true}
  if(a==='back'&&V.sec==='week'&&!RUN){if(V.wtab==='fri'&&V.wdeck!=null){V.wdeck=null;render();return true}if(V.wtab==='all'&&V.wadeck!=null){V.wadeck=null;render();return true}}
  if(a==='wadd'){const f=digits(V.wfrom||'').trim(),to=digits(V.wto||'').trim(),tx=(V.wtxt||'').trim();
    const pages=((f||to)?'لاپەڕە '+(f||'?')+(to?'–'+to:''):'')+(tx?((f||to)?' · ':'')+tx:'');
    if(!pages){toast('لاپەڕە یان ناوی بابەت بنووسە');return true}
    b.disabled=true;sb.rpc('weekly_add',{p_subject:SUBJ[V.wdeck!=null?V.wdeck:0],p_pages:pages.slice(0,80)}).then(r=>{b.disabled=false;if(r.error){toast(/only friday/.test(r.error.message)?'زیادکردن تەنها هەینی و شەممە':ERR.net);return}ST.wr.push(r.data);ST.wr.sort((x,y)=>x.next.localeCompare(y.next));V.wfrom='';V.wto='';V.wtxt='';render();toast('زیاد کرا')});return true}
  if(a==='wdone'){b.disabled=true;sb.rpc('weekly_done',{p_id:+b.dataset.id}).then(r=>{if(r.error){b.disabled=false;toast(/only friday/.test(r.error.message)?'تەنها ڕۆژانی هەینی و شەممە':ERR.net);return}
    const i=ST.wr.findIndex(z=>z.id==r.data.id);if(i>=0)ST.wr[i]=r.data;render();toast('ئافەرین! هەینی '+fmtD(r.data.next)+' دەگەڕێتەوە')});return true}
  if(a==='wdel'){if(!b.dataset.sure){b.dataset.sure=1;b.textContent='سڕینەوە؟';return true}const id=+b.dataset.id;ST.wr=ST.wr.filter(z=>z.id!==id);render();sb.from('weekly_review').delete().eq('id',id).then(r=>{if(r.error)toast(ERR.net)});return true}
  return false}
function plannerInput(t){
  if(t.dataset&&t.dataset.pi!=null){const P=ST.plans[curDay()];if(!P)return true;const x=P.items[+t.dataset.pi];if(!x)return true;const f=t.dataset.f;x[f]=(f==='kd'||f==='sb')?+t.value:t.value;savePlanSoon(curDay());
    if(f==='kd'||f==='sb')render();return true}
  if(t.id==='dgoal'){const P=ST.plans[curDay()];if(P){P.goal=t.value;savePlanSoon(curDay())}return true}
  if(t.id==='wfrom'||t.id==='wto'){V[t.id]=digits(t.value).replace(/[^\d]/g,'').slice(0,4);return true}
  if(t.id==='wtxt'){V.wtxt=t.value;return true}
  if(t.id==='wsub'){V.wsub=+t.value;return true}
  return false}

function viewSubs(){const all=statsFor(ALLQS),due=dueIds().length;
  return header('ئەسیلەکان','بانکی پرسیاری وەزاری · دەرسێک هەڵبژێرە',false,accBtn())+'<div class="wrap">'+
   '<div class="card" style="margin-top:14px;display:flex;gap:12px;align-items:center"><div style="flex:1"><b>پرسیاری حەلکراو</b><div class="muted" style="font-size:13px"><span class="num">'+all.seen+'</span> لە <span class="num">'+ALLQS.length+'</span>'+(all.seen?' · ڕاست <span class="num">'+all.pct+'%</span>':'')+'</div></div>'+(due?'<button class="btn dark" style="width:auto;padding-inline:16px" data-act="runreview">پێداچوونەوە (<span class="num">'+due+'</span>)</button>':'')+'</div>'+
   subGrid()+mixCard()+'</div>'}

// ================= FLASHCARDS (فلاشکارد) =================
// cards: index from rpc card_index (id,sub,ch,deck,sec); text from table flashcards (RLS: free chapters or paid)
// progress: Leitner boxes 0..5, saved locally and (when logged in) to card_progress via rpc save_cards
const FC={idx:null,txt:{},prog:{},sub:null,loaded:{},q:[]};
const FC_GAP=[0,1,3,7,14,30];
const FC_NEW=20;
function fcKey(){return 'klil_cards_'+(ST.user?ST.user.id:'guest')}
function fcLoadLocal(){FC.prog=load(fcKey(),{})}
function fcSaveLocal(){save(fcKey(),FC.prog)}
function fcSubs(){if(!FC.idx)return [];return SUBS.filter(s=>FC.idx.some(c=>c.sub===s))}
function fcCur(){const L=fcSubs();if(!FC.sub||!L.includes(FC.sub))FC.sub=L.includes(CUR)?CUR:L[0];return FC.sub}
function fcCards(sub){return (FC.idx||[]).filter(c=>c.sub===sub)}
function fcOpen(c){return canCh(c.ch)}
function fcMeta(sub){return SUBJ_META[sub]||{CH:{}}}
async function fcInit(){
  if(!FC.idx){const cached=load('klil_cidx',null);if(cached)FC.idx=cached.map(r=>({id:r[0],sub:r[1],ch:r[2],deck:r[3],sec:r[4]}))}
  fcLoadLocal();
  if(sb){try{const r=await sb.rpc('card_index');if(!r.error&&Array.isArray(r.data)){save('klil_cidx',r.data);FC.idx=r.data.map(r=>({id:r[0],sub:r[1],ch:r[2],deck:r[3],sec:r[4]}))}}catch(e){}}
  if(!FC.idx)FC.idx=[];
  if(ST.user&&sb){try{const r=await allRows(()=>sb.from('card_progress').select('cid,box,due').eq('user_id',ST.user.id));
    if(!r.error){(r.data||[]).forEach(x=>{const L=FC.prog[x.cid];if(!L||!L.t||(L.box<=x.box))FC.prog[x.cid]={box:x.box,due:x.due,t:L&&L.t||0}});fcSaveLocal()}}catch(e){}}
  const s=fcCur();if(s)await fcText(s);
  if(V.sec==='cards')render()}
async function fcText(sub){if(FC.loaded[sub]||!sb)return;
  const c=load('klil_ctxt_'+sub,null);if(c)c.forEach(x=>FC.txt[x.id]=x);
  try{const r=await allRows(()=>sb.from('flashcards').select('id,f,b,img').eq('sub',sub).order('ord',{ascending:true}));
    if(!r.error){r.data.forEach(x=>FC.txt[x.id]=x);save('klil_ctxt_'+sub,r.data);FC.loaded[sub]=1}}catch(e){}}
function fcBox(id){const p=FC.prog[id];return p?p.box:0}
function fcDue(id){const p=FC.prog[id];return !!(p&&p.box>0&&p.due&&p.due<=todayStr())}
function fcNew(id){return !FC.prog[id]}
function fcDone(id){return fcBox(id)>=4}
function fcStats(L){const n=L.length,seen=L.filter(c=>!fcNew(c.id)).length,master=L.filter(c=>fcDone(c.id)).length,due=L.filter(c=>fcDue(c.id)).length;return {n,seen,master,due,newN:n-seen,pct:n?Math.round(master/n*100):0}}
function fcDecks(sub){const by={};fcCards(sub).forEach(c=>{const k=c.ch+'|'+c.deck;(by[k]=by[k]||{ch:c.ch,deck:c.deck,cards:[]}).cards.push(c)});
  return Object.values(by).sort((a,b)=>a.ch-b.ch)}
function fcTodayIds(sub){const L=fcCards(sub).filter(fcOpen);const due=L.filter(c=>fcDue(c.id)).map(c=>c.id);
  const nw=L.filter(c=>fcNew(c.id)).slice(0,Math.max(0,FC_NEW-Math.min(due.length,FC_NEW))).map(c=>c.id);return due.concat(nw)}

// ---------- views ----------
function fcSubBar(){const L=fcSubs();if(L.length<2)return '';
  return '<div class="fsub">'+L.map(s=>{const I=SUBIC[s]||['📘','#EEE'];return '<button data-act="fcsub" data-s="'+s+'" aria-pressed="'+(s===FC.sub)+'"><span>'+I[0]+'</span>'+esc(subName(s))+'</button>'}).join('')+'</div>'}
function viewCards(){
  if(V.fcrun)return viewCardRun();
  const sub=fcCur();
  let h=header('فلاشکارد',sub?subName(sub)+' · زاراوە و پێناسەکانی کتێب':'زاراوە و پێناسەکانی کتێب',false,accBtn())+'<div class="wrap">';
  if(!FC.idx)return h+'<div class="card empty" style="margin-top:16px">چاوەڕێ بکە…</div></div>';
  if(!sub)return h+'<div class="card empty" style="margin-top:16px">بەم زووانە فلاشکارد زیاد دەکرێت.</div></div>';
  const all=fcCards(sub),S=fcStats(all.filter(fcOpen)),today=fcTodayIds(sub);
  h+=fcSubBar();
  h+='<div class="card fchero"><div class="fch1">'+ring(S.n?S.master/S.n*100:0,'لەبەرکراو')+'<div class="stack" style="gap:4px;flex:1"><b style="font-size:18px">کارتەکانی ئەمڕۆ</b>'+
     '<span class="muted" style="font-size:14px"><span class="num">'+S.due+'</span> بۆ پێداچوونەوە · <span class="num">'+Math.min(S.newN,Math.max(0,FC_NEW-Math.min(S.due,FC_NEW)))+'</span> کارتی نوێ</span>'+
     '<span class="muted" style="font-size:13px">لەبەرکراو <span class="num">'+S.master+'</span> لە <span class="num">'+S.n+'</span></span></div></div>'+
     (today.length?'<button class="btn" data-act="fctoday">دەستپێبکە ('+today.length+' کارت)</button>':'<div class="okmsg">ئەمڕۆ تەواوت کرد ✓ سبەینێ کارتی نوێ و پێداچوونەوە چاوەڕێتن.</div>')+'</div>';
  h+='<h2>بەندەکان</h2><div class="stack">'+fcDecks(sub).map(d=>{const open=canCh(d.ch),s=fcStats(d.cards);
    return '<button class="row deckrow" data-act="fcdeck" data-c="'+d.ch+'" data-d="'+esc(d.deck)+'"><div class="ix num">'+d.ch+'</div><div class="tx"><b>'+esc(d.deck)+'</b><span><span class="num">'+s.n+'</span> کارت'+(s.seen?' · لەبەرکراو <span class="num">'+s.master+'</span>':'')+(s.due?' · <b style="color:var(--gold)"><span class="num">'+s.due+'</span> ئەمڕۆ</b>':'')+'</span>'+(s.seen?'<div class="bar"><i style="width:'+Math.max(3,s.master/s.n*100)+'%"></i></div>':'')+'</div>'+(open?'':'<span class="lock">🔒</span>')+'</button>'}).join('')+'</div>';
  h+='<div class="card stack" style="margin-top:16px"><b>چۆن کار دەکات؟</b><span class="muted" style="font-size:14px;line-height:1.9">کرتە لە کارتەکە بکە بۆ بینینی وەڵامەکە. ئەگەر زانیت «زانیم» دابگرە، ئەگەر نا «نەمزانی». ئەوەی نەتزانیوە زوو دەگەڕێتەوە، ئەوەی زانیوتە دوای <span class="num">1</span>، <span class="num">3</span>، <span class="num">7</span>، <span class="num">14</span> و <span class="num">30</span> ڕۆژ دەگەڕێتەوە هەتا بە تەواوی لەبەری دەکەیت.</span></div>';
  return h+'</div>'}
function fcStart(ids,title){ids=ids.filter(id=>FC.idx.find(c=>c.id===id&&fcOpen(c)));if(!ids.length){toast('هیچ کارتێک نییە');return}
  V.fcrun={title,ids:ids.slice(),i:0,flip:0,ok:0,bad:0,again:{},n0:ids.length};render();scrollTo(0,0)}
function fcFront(t){const L=String(t).split('\n');return fx(L[0])+(L[1]?'<span class="fen" dir="ltr">'+fx(L.slice(1).join(' '))+'</span>':'')}
function fcBack(t){const P=String(t).split('\n\n');return fx(P[0]).replace(/\n/g,'<br>')+(P[1]?'<span class="fpg">'+fx(P[1])+'</span>':'')}
function fcCardHTML(id,flip){const T=FC.txt[id];if(!T)return '<div class="fcard"><div class="fface front"><div class="fct">چاوەڕێ بکە…</div></div></div>';
  const c=FC.idx.find(x=>x.id===id)||{};const dir=t=>/[A-Za-z]/.test(String(t).replace(/<[^>]+>/g,'').slice(0,12))&&!/[؀-ۿ]/.test(String(t).slice(0,20))?'ltr':'rtl';
  return '<div class="fscene"><button class="fcard'+(flip?' on':'')+'" data-act="fcflip" aria-label="هەڵگێڕانەوەی کارت">'+
   '<div class="fface front"><small class="fcs">'+(c.sec?c.sec+' · ':'')+esc(c.deck||'')+'</small><div class="fct" dir="'+dir(T.f)+'">'+fcFront(T.f)+'</div><span class="fhint">کرتە بکە بۆ وەڵام</span></div>'+
   '<div class="fface back"><small class="fcs">وەڵام</small>'+(T.img?'<img class="fimg" src="'+T.img+'" alt="">':'')+'<div class="fcb" dir="'+dir(T.b)+'">'+fcBack(T.b)+'</div></div></button></div>'}
function viewCardRun(){const R=V.fcrun;
  if(R.i>=R.ids.length){const pct=R.ok+R.bad?Math.round(R.ok/(R.ok+R.bad)*100):0;
    return header('تەواو بوو',R.title,true)+'<div class="wrap"><div class="card stack fcend" style="margin-top:16px;align-items:center;text-align:center">'+ring(pct,'زانیت')+
      '<b style="font-size:20px">ئافەرین! '+R.n0+' کارتت تەواو کرد</b><span class="muted">زانیم: <b class="num" style="color:var(--good)">'+R.ok+'</b> · نەمزانی: <b class="num" style="color:var(--bad)">'+R.bad+'</b></span>'+
      '<span class="muted" style="font-size:14px">ئەوانەی نەتزانین سبەینێ دەگەڕێنەوە.</span><button class="btn" data-act="fcback">گەڕانەوە بۆ فلاشکارد</button></div></div>'}
  const id=R.ids[R.i],T=FC.txt[id];if(!T)fcText(FC.sub).then(render);
  const done=R.i,total=R.ids.length;
  return header(R.title,'کارتی '+(done+1)+' لە '+total,true)+'<div class="wrap fcwrap"><div class="bar" style="margin-top:12px"><i style="width:'+(done/total*100)+'%"></i></div>'+
    '<div class="fcnt"><span class="pill" style="background:var(--goodsoft);color:var(--good)">✓ <span class="num">'+R.ok+'</span></span><span class="pill" style="background:var(--badsoft);color:var(--bad)">✗ <span class="num">'+R.bad+'</span></span></div>'+
    fcCardHTML(id,R.flip)+
    (R.flip?'<div class="grid2 fcbtns"><button class="btn fno" data-act="fcno">✗ نەمزانی</button><button class="btn fyes" data-act="fcyes">✓ زانیم</button></div>':'<button class="btn dark" data-act="fcflip" style="margin-top:16px">نیشاندانی وەڵام</button>')+
    '</div>'}
let FCSAVE=[],FCT=null;
function fcPush(id){const p=FC.prog[id];FCSAVE=FCSAVE.filter(x=>x.c!==id);FCSAVE.push({c:id,box:p.box,due:p.due});clearTimeout(FCT);FCT=setTimeout(fcFlush,1500)}
async function fcFlush(){if(!ST.user||!sb||!FCSAVE.length)return;const b=FCSAVE;FCSAVE=[];try{const r=await sb.rpc('save_cards',{p:b});if(r.error)FCSAVE=b.concat(FCSAVE)}catch(e){FCSAVE=b.concat(FCSAVE)}}
function fcAnswer(ok){const R=V.fcrun,id=R.ids[R.i],t=todayStr();let p=FC.prog[id]||{box:0,due:t};
  if(ok){if(!R.again[id]){p.box=Math.min(5,p.box+1);R.ok++}p.due=addDays(t,FC_GAP[p.box]||1)}
  else{p.box=1;p.due=addDays(t,1);if(!R.again[id]){R.bad++;R.again[id]=1;R.ids.push(id)}}
  p.t=Date.now();FC.prog[id]=p;fcSaveLocal();fcPush(id);
  R.i++;R.flip=0;render()}
function cardsClick(a,b){
  if(a==='fcsub'){FC.sub=b.dataset.s;fcText(FC.sub).then(render);render();return true}
  if(a==='fctoday'){fcStart(fcTodayIds(fcCur()),'کارتەکانی ئەمڕۆ · '+subName(FC.sub));return true}
  if(a==='fcdeck'){const ch=+b.dataset.c;if(needLock(ch))return true;const L=fcCards(fcCur()).filter(c=>c.ch===ch&&c.deck===b.dataset.d);
    const nw=L.filter(c=>fcNew(c.id)||fcDue(c.id)).map(c=>c.id);fcStart(nw.length?nw:shuffle(L.map(c=>c.id)),b.dataset.d);return true}
  if(a==='fcflip'){if(V.fcrun){V.fcrun.flip=V.fcrun.flip?0:1;const el=document.querySelector('.fcard');if(el&&V.fcrun.flip){el.classList.add('on');setTimeout(render,320)}else render()}return true}
  if(a==='fcyes'){fcAnswer(true);return true}
  if(a==='fcno'){fcAnswer(false);return true}
  if(a==='fcback'){V.fcrun=null;fcFlush();render();scrollTo(0,0);return true}
  return false}
function cardsBack(){if(V.fcrun){V.fcrun=null;fcFlush();render();scrollTo(0,0);return true}return false}

render();
