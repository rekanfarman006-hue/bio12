function b64u(s){const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))}
let PUSH_OK=null;
async function pushReady(ask){try{if(PUSH_OK)return PUSH_OK;if(!sb||!ST.user||!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))return null;
  if(Notification.permission==='default'&&ask)await Notification.requestPermission();if(Notification.permission!=='granted')return null;
  let k=(await sb.rpc('push_public_key')).data;if(!k){await sb.functions.invoke('push',{body:{}});k=(await sb.rpc('push_public_key')).data}if(!k)return null;
  const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(k)});
  const j=sub.toJSON();const r=await sb.rpc('push_save',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});if(r.error)return null;return PUSH_OK=sub}catch(e){return null}}
function foSim(F){// every end that is coming, if nobody touches the timer
  const L=[];if(!F||F.paused)return L;let c=Object.assign({},F),at=c.end,n=0;
  const msg=x=>x.ph==='work'?['پۆمۆدۆرۆ تەواو بوو ✅','کاتی پشووە. هەستە، ئاو بخۆوە.']:['پشوو تەواو بوو 📚','با دەست بکەینەوە بە خوێندن.'];
  while(c&&n<40){const done=(c.done||0)+(c.ph==='work'?1:0);
    if(c.ph==='work'&&c.goal&&done>=c.goal){L.push({at:new Date(at).toISOString(),title:'ئافەرین! 🎉',body:done+' پۆمۆدۆرۆت تەواو کرد.'});break}
    const m=msg(c);L.push({at:new Date(at).toISOString(),title:m[0],body:m[1]});if(c.auto===false)break;
    if(c.ph==='work'){const cyc=(c.cyc||0)+1;if(!(c.brk>0)){c={ph:'work',dur:c.wd||c.dur,wd:c.wd||c.dur,brk:0,goal:c.goal,done,auto:c.auto,lbm:c.lbm,cyc}}else{const bm=cyc%4===0?Math.max(c.lbm||25,c.brk):c.brk;c={ph:'break',dur:bm,wd:c.wd||c.dur,brk:c.brk,goal:c.goal,done,auto:c.auto,lbm:c.lbm,cyc}}}
    else c={ph:'work',dur:c.wd,wd:c.wd,brk:c.brk,goal:c.goal,done:c.done||0,auto:c.auto,lbm:c.lbm,cyc:c.cyc||0};
    at+=c.dur*60000;n++}
  return L}

let FO_AC=null,FO_WL=null,FO_T=null;
function foBeep(n){try{FO_AC=FO_AC||new (window.AudioContext||window.webkitAudioContext)();const ac=FO_AC;if(ac.state==='suspended')ac.resume();
  for(let i=0;i<(n||3);i++){const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*0.45;o.type='sine';o.frequency.value=i%2?880:660;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.35,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+0.38);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+0.4)}}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}

function foNotify(t,b){try{if(document.visibilityState==='visible'||!('Notification' in window)||Notification.permission!=='granted')return;
  const o={body:b,icon:'icon-192.png',tag:'klil-fo',renotify:true,vibrate:[300,150,300]};
  if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification(t,o)).catch(()=>{try{new Notification(t,o)}catch(e){}});else new Notification(t,o)}catch(e){}}
// a session: work → break → work … until the chosen number of pomodoros. Every 4th break is long.
// auto: the next part starts by itself (even if the app was closed, time keeps going from the planned end);
// manual: it waits until the student taps to start the next part.
function foNext(F,at){// F has just finished; at = when it finished
  if(F.ph==='work'){foAddHist(F.dur,F.sub,1);const done=(F.done||0)+1,cyc=(F.cyc||0)+1;
    if(F.goal&&done>=F.goal){foPut(null);foLock(false);V.foEnd=-2;V.foDone=done;foBeep(5);foNotify('ئافەرین! 🎉',done+' پۆمۆدۆرۆت تەواو کرد.');return null}
    if(!(F.brk>0))return {ph:'work',dur:F.wd||F.dur,brk:0,wd:F.wd||F.dur,sub:F.sub,end:at+(F.wd||F.dur)*60000,paused:false,left:0,qi:(F.qi||0)+1,goal:F.goal,done,auto:F.auto,lbm:F.lbm,cyc};
    const lb=cyc%4===0,bm=lb?Math.max(F.lbm||25,F.brk):F.brk;
    return {ph:'break',dur:bm,brk:F.brk,wd:F.wd||F.dur,sub:F.sub,end:at+bm*60000,paused:false,left:0,qi:F.qi,goal:F.goal,done,auto:F.auto,lbm:F.lbm,cyc,lb}}
  const wd=F.wd||foSet().dur;
  return {ph:'work',dur:wd,brk:F.brk,wd,sub:F.sub,end:at+wd*60000,paused:false,left:0,qi:(F.qi||0)+1,goal:F.goal,done:F.done||0,auto:F.auto,lbm:F.lbm,cyc:F.cyc||0}}
function foDone(F){let N=F,at=F.end,steps=0;const wasWork=F.ph==='work';
  if(F.auto===false){// manual: stop and wait
    const X=foNext(F,Date.now());if(!X){render();return}X.wait=1;X.paused=true;X.left=X.dur*60000;foPut(X);foLock(false);foBeep(wasWork?4:3);
    foNotify(wasWork?'پۆمۆدۆرۆ تەواو بوو':'پشوو تەواو بوو',wasWork?'کاتی پشووە. کە ئامادە بوویت دەستی پێبکە.':'ئامادەیت بۆ پۆمۆدۆرۆی دواتر؟');render();return}
  // auto: catch up on every part that ended while the app was closed
  while(N&&!N.paused&&N.end<=Date.now()&&steps<60){N=foNext(N,at);steps++;if(N)at=N.end}
  if(!N){render();return}
  foPut(N);foBeep(N.ph==='work'?3:4);
  const msg=N.ph==='work'?'پشوو تەواو بوو، پۆمۆدۆرۆی ژمارە '+((N.done||0)+1)+' دەستی پێکرد':N.lb?'ئافەرین! پشوویەکی درێژی '+N.dur+' خولەکی':'ئافەرین! کاتی پشووە ('+N.dur+' خولەک)';
  toast(msg);foNotify(N.ph==='work'?'کاتی خوێندنە 📚':'کاتی پشووە ☕',msg);if(N.ph==='work')foLock(true);foTick();render()}

function chq(q){return +(q.ch||String(q.s||'').split('.')[0])||0}
function cmQs(sub,ch){return Object.values(BYID).filter(q=>q.sub===sub&&chq(q)===ch)}
function cmChs(sub){const c={};Object.values(BYID).forEach(q=>{if(q.sub===sub){const k=chq(q);if(k)c[k]=(c[k]||0)+1}});return Object.keys(c).map(Number).sort((a,b)=>a-b).map(k=>({k,n:c[k]}))}
function cmCount(n){return n===1?20:n===2?25:n*10}
function cmChName(sub,k){const M=SUBJ_META[sub]||{};return (M.CH&&(M.CH[k]||M.CH[String(k)]))||''}
function cmCanCh(sub,k){return paid()||FREE_CH.includes(k)}
// seeded shuffle so a ready paper always has the same questions
function sshuf(a,seed){a=a.slice();let x=seed>>>0||1;const r=()=>{x^=x<<13;x>>>=0;x^=x>>17;x^=x<<5;x>>>=0;return x/4294967296};for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function hsh(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function cmPick(sub,chs){const total=cmCount(chs.length),per=chs.length===1?20:chs.length===2?[13,12]:chs.map(()=>10);
  const seen=new Set(load('klil_cms_'+sub,[]));let out=[];
  chs.forEach((c,i)=>{const n=Array.isArray(per)?per[i]:per;const L=shuffle(cmQs(sub,c).map(q=>q.id));const a=L.filter(id=>!seen.has(id)),b=L.filter(id=>seen.has(id));out=out.concat(a.concat(b).slice(0,n))});
  out=shuffle(out).slice(0,total);const S=[...seen,...out];save('klil_cms_'+sub,S.slice(-1500));return out}
// ready papers: chapters in pairs (1+3, 2+4, 5+7, 6+8 …), questions alternate A,B,A,B, 25 per paper
function cmPairs(chs){const k=chs.map(x=>x.k),P=[];for(let i=0;i<k.length;i+=4){const g=k.slice(i,i+4);if(g.length===4){P.push([g[0],g[2]],[g[1],g[3]])}else if(g.length===3){P.push([g[0],g[2]],[g[1],k[0]===g[1]?k[1]:k[0]])}else if(g.length===2)P.push([g[0],g[1]]);else if(g.length===1)P.push([g[0],k[0]===g[0]?k[1]:k[0]])}return P.filter(p=>p[0]&&p[1])}
function cmPapers(sub,pair){const A=sshuf(cmQs(sub,pair[0]).map(q=>q.id).sort(),hsh(sub+pair[0])),B=sshuf(cmQs(sub,pair[1]).map(q=>q.id).sort(),hsh(sub+pair[1]));
  const papers=[];let i=0,j=0;while(i<A.length||j<B.length){const p=[];while(p.length<25&&(i<A.length||j<B.length)){if((p.length%2===0&&i<A.length)||j>=B.length)p.push(A[i++]);else p.push(B[j++])}if(p.length>=15||!papers.length)papers.push(p);else papers[papers.length-1]=papers[papers.length-1].concat(p)}return papers}

  return '<div class="chprev"><div class="chpvtop"><button data-fx="chfx" aria-label="داخستن">✕</button><span>'+(F.kind==='image'?'ناردنی وێنە':'ناردنی فایل')+'</span><i></i></div>'+
   '<div class="chpvbody">'+(F.kind==='image'?'<img src="'+F.url+'" alt="">':'<div class="chpvpdf"><span class="pdfi">PDF</span><b dir="auto">'+esc(F.name)+'</b><small class="num">'+(F.blob.size/1048576).toFixed(1)+' MB</small></div>')+'</div>'+
   '<div class="chpvbar"><textarea id="chcap" rows="1" maxlength="900" placeholder="شتێک بنووسە (ئارەزوومەندانە)…" dir="auto"></textarea><button class="chsend" data-fx="chsend" aria-label="ناردن"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4 3 11l7 2 2 7Z"/></svg></button></div></div>'}
function chatKeep(){const y=scrollY;render();scrollTo(0,y)}
async function chatSend(){if(CHT.busy||!sb||!ST.user)return;const ta=document.getElementById(CHT.file?'chcap':'chin'),body=(ta&&ta.value||'').trim(),F=CHT.file;
  if(!body&&!F)return;if(chatWords(body)>100){toast('نامەکە لە 100 وشە زیاترە.');return}
  CHT.busy=1;const btn=document.querySelector('.chsend');btn&&(btn.disabled=true);
  try{let path=null,kind='text',name=null;
    if(F){const ext=F.kind==='pdf'?'pdf':'jpg';path=ST.user.id+'/'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)+'.'+ext;
      const up=await sb.storage.from('chat').upload(path,F.blob,{contentType:F.type,upsert:false});if(up.error)throw up.error;kind=F.kind;name=F.name}
    const r=await sb.rpc('chat_send',{p_room:CHT.room,p_body:body,p_kind:kind,p_path:path,p_name:name});if(r.error)throw r.error;if(r.data&&r.data.error){if(path)sb.storage.from('chat').remove([path]).catch(()=>{});throw new Error(r.data.error)}
    if(F&&F.url)try{URL.revokeObjectURL(F.url)}catch(e){};if(!F)CHT.draft='';CHT.file=null;if(ta){ta.value='';ta.style.height=''}const L=CHT.msgs[CHT.room]||(CHT.msgs[CHT.room]=[]);if(r.data&&!L.some(x=>x.id===r.data.id)){L.push(r.data);CHT.last[CHT.room]=Math.max(CHT.last[CHT.room]||0,r.data.id)}
    if(CHT.st)CHT.st.sent++;if(F){render()}else{chatPaint(true);chatHdr();const c=document.getElementById('chcnt');c&&(c.innerHTML='<span class="num">0</span> / <span class="num">100</span> وشە')}
  }catch(e){toast(chatErr(e&&e.message||String(e)));if(/time up|banned/.test(e&&e.message||''))chatStatus().then(render)}
  finally{CHT.busy=0;const b2=document.querySelector('.chsend');b2&&(b2.disabled=false)}}
function p7Click(a,b){
  if(a==='mixtile'){if(needLogin())return true;V.mainY=scrollY;V.sh=(V.sh||[]).concat([{s:'main',y:scrollY}]).slice(-10);RUN=null;V.mixFrom='main';V.sec='bank';V.tab='home';V.stack=[{v:'mixpick'}];render();scrollTo(0,0);return true}
  if(a==='chroom'){CHT.room=b.dataset.r;render();return true}
  if(a==='chretry'){CHT.err=0;chatPaint(false);chatLoad(CHT.room).then(()=>chatPaint(true));return true}
  if(a==='chrules'){save('klil_chat_rules',1);render();return true}
  if(a==='chatt'){const fi=document.getElementById('chfile');fi&&fi.click();return true}
  if(a==='chfx'){if(CHT.file&&CHT.file.url)try{URL.revokeObjectURL(CHT.file.url)}catch(e){};CHT.file=null;chatKeep();return true}
  if(a==='chsend'){chatSend();return true}
  if(a==='chdel'){const id=+b.dataset.id;sb.rpc('chat_delete',{p_id:id}).then(r=>{if(r.error){toast(ERR.net);return}const L=CHT.msgs[CHT.room]||[];const i=L.findIndex(x=>x.id===id);if(i>=0)L.splice(i,1);chatPaint(false)},()=>toast(ERR.net));return true}
  if(a==='chrep'){sb.rpc('chat_report',{p_id:+b.dataset.id}).then(()=>toast('سوپاس، ئەدمین سەیری دەکات.'),()=>toast(ERR.net));return true}
  return false}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&e.target&&e.target.id==='chin'&&matchMedia('(pointer:fine)').matches){e.preventDefault();chatSend()}});

addEventListener('online',()=>{if(ST.ready){render();if(ST.user&&NBX.sync===2){NBX.sync=0}}});
addEventListener('offline',()=>{if(ST.ready)render()});

app.addEventListener('click',e=>{const b=e.target.closest('[data-fx]');if(!b)return;const a=b.dataset.fx;e.stopPropagation();if(focusClick(a,b)||nbClick(a,b)||cmClick(a,b)||tmClick(a,b)||tourClick(a,b)||p6Click(a,b)||p7Click(a,b)||proClick(a,b))return;if(/^gr/.test(a))grClick(a,b)});
app.addEventListener('input',e=>{const t=e.target;if(!t)return;if(t.dataset&&t.dataset.nbq){nbNote(t.dataset.nbq,t.value);return}
  if(t.id==='nbq'){V.nbq=t.value;clearTimeout(NB_NT);render();return}
  if(t.id==='grj'){V.grj=grCode(t.value);if(t.value!==V.grj)t.value=V.grj;return}
  if(t.id==='grn'){V.grn=t.value;return}
  if(t.id==='grtime'){V.grtime=t.value;return}
  if(t.id==='grrm'){const v=+digits(t.value).replace(/\D/g,'');if(v>=1&&v<=25){V.grr=v;document.querySelectorAll('[data-fx=grr]').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.n===v))}return}
  if(t.id==='grdm'){const v=+digits(t.value).replace(/\D/g,'');if(v>=1&&v<=240){V.grd=v;document.querySelectorAll('[data-fx=grdur]').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.m===v))}return}
  if(t.id==='fog'){const v=+digits(t.value).replace(/\D/g,'');if(v>=1&&v<=50){foSaveSet({goal:v});document.querySelectorAll('[data-fx=fogoal]').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.m===v));const p=document.querySelector('.fosum');if(p)p.innerHTML=foPlan(foSet())}}
  if(t.id==='fom'||t.id==='fob'){const v=+digits(t.value).replace(/\D/g,'');if(t.id==='fom'){if(v>=FO_MIN&&v<=240){foSaveSet({dur:v});const g=document.getElementById('fogon');if(g)g.textContent=v;document.querySelectorAll('[data-fx=fodur]').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.m===v))}}
    else if(t.value!==''&&v<=60){foSaveSet({brk:v});document.querySelectorAll('[data-fx=fobrk]').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.m===v))}}});
app.addEventListener('change',e=>{const t=e.target;if(t&&t.id==='grpub')V.grpub=t.checked;if(t&&t.id==='grtime')V.grtime=t.value});
if(foSt())foTick();

document.addEventListener('click',e=>{const im=e.target.closest&&e.target.closest('img.qimg');if(!im)return;const d=document.createElement('div');d.className='zoomov';d.innerHTML='<button class="zx" aria-label="داخستن">×</button><img alt="" src="'+im.src+'">';d.addEventListener('click',ev=>{if(ev.target.tagName!=='IMG'||ev.target.closest('.zx'))d.remove()});document.body.appendChild(d)});

document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.tagName==='DETAILS'&&d.open&&d.classList.contains('mdet'))document.querySelectorAll('details.mdet[open]').forEach(x=>{if(x!==d)x.open=false})},true);
